    multivalued: true
  has_party:
    name: has_party
    definition_uri: https://w3id.org/lmodel/gist/has_party
    description: Relates an event, agreement, or obligation to a participating person
      or organization.
    comments:
    - Subproperties may be defined to describe specific parties, such as hasLender
      and hasBorrower for a loan.
    examples:
    - value: Loan agreements have lender and borrower parties.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - has party
    mappings:
    - gist:hasParty
    is_a: has_participant
    slot_uri: gist:hasParty
    range: string
    multivalued: true
    any_of:
    - range: Organization
    - range: Person
  has_physical_location:
    name: has_physical_location
    definition_uri: https://w3id.org/lmodel/gist/has_physical_location
    description: Relates something to its physical location.
    comments:
