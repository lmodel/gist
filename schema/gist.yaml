    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is about
    mappings:
    - gist:isAbout
    domain: Content
    slot_uri: gist:isAbout
    owner: is_about
    range: string
    multivalued: true
  is_affected_by:
    name: is_affected_by
    definition_uri: https://w3id.org/lmodel/gist/is_affected_by
    description: Relates an affected thing to the source of the effect.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is affected by
    mappings:
    - gist:isAffectedBy
    slot_uri: gist:isAffectedBy
    range: string
    multivalued: true
  is_allocated_by:
    name: is_allocated_by
    definition_uri: https://w3id.org/lmodel/gist/is_allocated_by
    annotations:
      domain_includes:
        tag: domain_includes
        value: gist:Category, gist:ID
    description: Relates something to whomever or whatever assigns or distributes
      it.
    comments:
    - The allocator may be a person, organization, or automated process.
    examples:
    - value: A U.S. Social Security number is allocated by the U.S. Social Security
        Administration; the media type https://www.iana.org/assignments/media-types/text/csv
        is allocated by the Internet Assigned Numbers Authority (IANA).
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is allocated by
    mappings:
    - gist:isAllocatedBy
    slot_uri: gist:isAllocatedBy
    range: string
    multivalued: true
    any_of:
    - range: IntellectualProperty
    - range: Organization
    - range: Person
  is_assignment_of:
    name: is_assignment_of
    definition_uri: https://w3id.org/lmodel/gist/is_assignment_of
    annotations:
      domain_includes:
        tag: domain_includes
        value: gist:Assignment
      range_includes:
        tag: range_includes
        value: gist:Equipment, gist:IntellectualProperty, gist:Organization, gist:Person
    description: Relates an assignment to the resource it assigns.
    comments:
    - People, organizations, monetary amounts, equipment can all be assigned.
    - While typically this predicate will be used with assignment subjects, there
      may be other use cases, and therefore a domain is not specified.
    examples:
    - value: Assignment of a person to a project.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is assignment of
    mappings:
    - gist:isAssignmentOf
    domain: Assignment
    slot_uri: gist:isAssignmentOf
    owner: is_assignment_of
    range: string
    multivalued: true
    any_of:
    - range: Equipment
    - range: IntellectualProperty
    - range: Organization
    - range: Person
  is_assignment_to:
    name: is_assignment_to
    definition_uri: https://w3id.org/lmodel/gist/is_assignment_to
    annotations:
      domain_includes:
        tag: domain_includes
        value: gist:Assignment
    description: Relates something (typically an assignment) to the thing the resource
      is assigned to, such as a project, position, organization, pay rate, or billing
      rate.
    comments:
    - While typically this predicate will be used with gist:Assignment subjects, there
      may be other use cases, and therefore a domain is not specified.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is assignment to
    mappings:
    - gist:isAssignmentTo
    domain: Assignment
    slot_uri: gist:isAssignmentTo
    owner: is_assignment_to
    range: string
    multivalued: true
