    range: LivingThing
    multivalued: true
    inlined: true
    inlined_as_list: true
  has_broader:
    name: has_broader
    definition_uri: https://w3id.org/lmodel/gist/has_broader
    description: Relates a thing to another thing with a broader meaning.
    examples:
    - value: The aspect distance is broader than the aspect height.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - has broader
    mappings:
    - gist:hasBroader
    slot_uri: gist:hasBroader
    transitive: true
    range: string
    multivalued: true
  has_direct_broader:
    name: has_direct_broader
    definition_uri: https://w3id.org/lmodel/gist/has_direct_broader
    description: Relates a thing to another thing with a broader meaning, when there
      is no intermediate between them.
    comments:
    - Unlike gist:hasBroader, this property is not transitive. It is safest to use
      this property when semantic directness is inherent in the relationship. Otherwise,
      there is a risk of making a hasDirectBroader assertion and then later inserting
      an intermediate part; this will result in making an asserted triple false even
      though there was no change in the world. When in doubt, use the transitive version
      gist:hasBroader.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - has direct broader
    mappings:
    - gist:hasDirectBroader
    is_a: has_broader
    slot_uri: gist:hasDirectBroader
    range: string
    multivalued: true
  has_divisor:
    name: has_divisor
    definition_uri: https://w3id.org/lmodel/gist/has_divisor
    description: Relates a unit of measure to another unit of measure that is a divisor,
      or relates an aspect to another aspect that is a divisor.
    comments:
    - Provides a supplemental method of decomposing a unit of measure or an aspect
      into component factors. Enables dimensional analysis such as miles per hour
      x hours = miles.
    examples:
    - value: Miles per hour has miles as a multiplier and hour as a divisor; speed
        has distance as a multiplier and duration as a divisor.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - has divisor
    mappings:
    - gist:hasDivisor
    slot_uri: gist:hasDivisor
    range: string
    multivalued: true
  has_giver:
    name: has_giver
    definition_uri: https://w3id.org/lmodel/gist/has_giver
    description: Relates something to the participant that provides it.
    comments:
    - This property is often used in abstract contexts such as agreements, obligations,
      contracts, etc., whereas gist:comesFromAgent is intended to describe the physical
      or electronic transfer of something, such as a package or email, from one agent
      to another. However, there are contexts in which either may be appropriate,
      such as the giving of a gift.
    examples:
    - value: An offer is made by a giver; an obligation has a giver who is obligated
        to another person; a gift is presented by the giver.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - has giver
    mappings:
    - gist:hasGiver
    is_a: has_participant
    slot_uri: gist:hasGiver
    disjoint_with:
    - has_recipient
    range: string
    multivalued: true
  has_goal:
    name: has_goal
    definition_uri: https://w3id.org/lmodel/gist/has_goal
    description: Relates something to the end towards which it directs effort.
    examples:
    - value: The sales division of a company has the goal of acquiring new customers
        and contracts.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - has goal
    mappings:
    - gist:hasGoal
    slot_uri: gist:hasGoal
    range: string
    multivalued: true
  has_incumbent:
    name: has_incumbent
    definition_uri: https://w3id.org/lmodel/gist/has_incumbent
    description: Relates a position to the thing or person that currently holds that
      position.
