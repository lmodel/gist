slots:
  allows:
    name: allows
    definition_uri: https://w3id.org/lmodel/gist/allows
    description: Relates a permission to a particular activity or type of activity
      it allows.
    examples:
    - value: An easement grants a right to cross or otherwise use someone else's land
        for a specified purpose.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - allows
    mappings:
    - gist:allows
    slot_uri: gist:allows
    range: string
    multivalued: true
  comes_from_agent:
    name: comes_from_agent
    definition_uri: https://w3id.org/lmodel/gist/comes_from_agent
    description: Relates something to the originating agent.
    comments:
    - This is not the inverse of gist:goesToAgent, as both properties have the message
      or shipment as the subject.
    - This property is intended to describe the physical or electronic transfer of
      something, such as a package or email, from one agent to another, whereas gist:hasGiver
      is typically used in more abstract contexts such as agreements, obligations,
      contracts, etc. However, there are contexts in which either may be appropriate,
      such as the giving of a gift.
    examples:
    - value: A package is shipped by a person; a purchase order is emailed to a vendor
        by an organization.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - comes from agent
    mappings:
    - gist:comesFromAgent
    is_a: has_participant
    slot_uri: gist:comesFromAgent
    range: string
    multivalued: true
    any_of:
    - range: Organization
    - range: Person
  comes_from_place:
    name: comes_from_place
    definition_uri: https://w3id.org/lmodel/gist/comes_from_place
    description: Relates something to its place of origin.
    examples:
    - value: A letter has a return address indicating its origin; a delivery route
        originates at a distribution center; a trail originates at the trailhead.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - comes from place
    mappings:
    - gist:comesFromPlace
    slot_uri: gist:comesFromPlace
    range: string
    multivalued: true
    any_of:
    - range: Address
    - range: GeoLocation
  conforms_to:
    name: conforms_to
    definition_uri: https://w3id.org/lmodel/gist/conforms_to
    annotations:
      range_includes:
        tag: range_includes
        value: gist:Intention
    description: The subject is consistent with or satisfies the requirements, rules,
      or expectations established by the object.
    examples:
    - value: Meet an obligation; adhere to a specification or standard; meet terms
        and conditions of an offer; comply with a regulation.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - conforms to
    mappings:
    - gist:conformsTo
    slot_uri: gist:conformsTo
    range: Intention
    multivalued: true
    inlined: true
    inlined_as_list: true
  contributes_to:
    name: contributes_to
    definition_uri: https://w3id.org/lmodel/gist/contributes_to
    description: The subject helps achieve or fulfill the goals or functions of the
      object.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - contributes to
    mappings:
    - gist:contributesTo
    slot_uri: gist:contributesTo
    range: string
    multivalued: true
  goes_to_agent:
    name: goes_to_agent
    definition_uri: https://w3id.org/lmodel/gist/goes_to_agent
    description: Relates something to the agent that receives it.
    comments:
    - This is not the inverse of gist:comesFromAgent, as both properties have the
      message or shipment as the subject.
    - This property is intended to describe the physical or electronic transfer of
      something, such as a package or email, from one agent to another, whereas gist:hasRecipient
      is typically used in more abstract contexts such as agreements, obligations,
      contracts, etc. However, there are contexts in which either may be appropriate,
      such as the receiving of a gift.
    examples:
    - value: A package is sent to a person; a purchase order email is received by
        a vendor.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - goes to agent
    mappings:
    - gist:goesToAgent
    is_a: has_participant
    slot_uri: gist:goesToAgent
    range: string
    multivalued: true
    any_of:
    - range: Organization
    - range: Person
  goes_to_place:
    name: goes_to_place
    definition_uri: https://w3id.org/lmodel/gist/goes_to_place
    description: Relates something to its destination place.
    examples:
    - value: A letter has an address indicating its destination; a segment of a delivery
        route terminates at a delivery location; a trail terminates at an intersection
        with another trail.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - goes to place
    mappings:
    - gist:goesToPlace
    slot_uri: gist:goesToPlace
    range: string
    multivalued: true
    any_of:
    - range: Address
    - range: GeoLocation
  has_accuracy:
    name: has_accuracy
    definition_uri: https://w3id.org/lmodel/gist/has_accuracy
    annotations:
      domain_includes:
        tag: domain_includes
        value: gist:Magnitude
    description: Relates a magnitude to another magnitude that describes its accuracy.
    comments:
    - "gist uses the ISO-5725 definition of accuracy, which is a combination of trueness\
      \ (a measure of systemic error) and precision (a measure of random error). The\
      \ accuracy of a measurement method describes how close its measurements are\
      \ to actual values. Similarly, the accuracy of an individual measurement is\
      \ its likely closeness to the actual value. When we say a temperature measurement\
      \ is accurate to within a tenth of a degree, it means with a certain probability\
      \ such as 95%.\r\n\r\nNote that the unit of measure of the accuracy has to be\
      \ compatible with the unit of measure of the original magnitude (e.g. something\
      \ measured in meters could have an accuracy in terms of millimeters or any other\
      \ unit that measures distance)."
    examples:
    - value: Temperature accurate to tenth of a degree C; length accurate to the nearest
        centimeter.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - has accuracy
    mappings:
    - gist:hasAccuracy
    domain: Magnitude
    slot_uri: gist:hasAccuracy
    owner: has_accuracy
    range: Magnitude
    multivalued: false
    inlined: true
    inlined_as_list: true
  has_addend:
    name: has_addend
    definition_uri: https://w3id.org/lmodel/gist/has_addend
    description: Relates an aspect to another aspect that is an additive component
      of it.
    comments:
    - Commonly used with financial metrics.
    examples:
    - value: In the equation 'profit = revenue - expenses', revenue is an addend and
        expenses is a subtrahend.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - has addend
    mappings:
    - gist:hasAddend
    slot_uri: gist:hasAddend
    range: string
    multivalued: true
  has_address:
    name: has_address
    definition_uri: https://w3id.org/lmodel/gist/has_address
