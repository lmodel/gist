    transitive: true
    range: GeoLocation
    multivalued: true
    inlined: true
    inlined_as_list: true
  has_recipient:
    name: has_recipient
    definition_uri: https://w3id.org/lmodel/gist/has_recipient
    description: Relates something to the participant that receives or is intended
      to receive it.
    comments:
    - This property is used in abstract contexts such as agreements, obligations,
      contracts, etc., whereas gist:goesToAgent is intended to describe the physical
      or electronic transfer of something, such as a package or email, from one agent
      to another. However, there are contexts in which either may be appropriate,
      such as the giving of a gift.
    examples:
    - value: An offer is made to a recipient; an obligation has a recipient to whom
        another person is obligated; a gift is bestowed upon a recipient.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - has recipient
    mappings:
    - gist:hasRecipient
    is_a: has_participant
    slot_uri: gist:hasRecipient
    range: string
    multivalued: true
  has_subtrahend:
