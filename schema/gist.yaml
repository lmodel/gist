    multivalued: true
    inlined: true
    inlined_as_list: true
  has_multiplier:
    name: has_multiplier
    definition_uri: https://w3id.org/lmodel/gist/has_multiplier
    description: Relates a unit of measure to another unit of measure that is a factor,
      or relates an aspect to another aspect that is a factor.
    comments:
    - Provides a supplemental method of decomposing a unit of measure or aspect into
      component factors. Enables dimensional analysis such as miles per hour x hours
      = miles.
    examples:
    - value: Miles per hour has miles as a multiplier and hours as a divisor; speed
        has distance as a multiplier and duration as a divisor.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - has multiplier
    mappings:
    - gist:hasMultiplier
    slot_uri: gist:hasMultiplier
    range: string
    multivalued: true
  has_navigational_parent:
    name: has_navigational_parent
    definition_uri: https://w3id.org/lmodel/gist/has_navigational_parent
    description: Relates a child category to a parent category in an informal (e.g.,
      faceted) hierarchy.
    examples:
    - value: Refrigerator handles are not refrigerators, but it may be useful to represent
        their relationship hierarchically for a faceted UI filter.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - has navigational parent
    mappings:
    - gist:hasNavigationalParent
    slot_uri: gist:hasNavigationalParent
    range: string
    multivalued: true
  has_participant:
    name: has_participant
    definition_uri: https://w3id.org/lmodel/gist/has_participant
    description: Relates something (e.g. an agreement) to things that play a role,
      or take part or are otherwise involved in some way.
    comments:
    - The thing with participants will often be an agreement, event or obligation.
      Participation does not imply agency.
    - This will most often be used as an abstract property. Use subproperties that
      indicate the nature of the participation (e.g. hasBorrower, hasVenue).
    examples:
    - value: An event of transferring money has a participating account that receives
        the money.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - has participant
    mappings:
    - gist:hasParticipant
