    name: is_connected_to
    definition_uri: https://w3id.org/lmodel/gist/is_connected_to
    description: A non-owning, non-causal, non-subordinate (i.e., peer-to-peer) relationship.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is connected to
    mappings:
    - gist:isConnectedTo
    slot_uri: gist:isConnectedTo
    symmetric: true
    range: string
    multivalued: true
  is_direct_part_of:
    name: is_direct_part_of
    definition_uri: https://w3id.org/lmodel/gist/is_direct_part_of
    description: The relationship between a part and a whole where the part has independent
      existence and there are no other parts in between.
    comments:
    - Because the part has independent existence, there is no cascading delete.
    - It is safest to use this property when semantic directness is inherent in the
      relationship, rather than simply expressing a chosen granularity. For example,
      a spark plug is a direct part of an engine block; there cannot be any intermediate
      parts. Otherwise, there is a risk of making an isDirectPartOf assertion and
      then later inserting an intermediate part; this will result in making an asserted
      triple false even though there was no change in the world. When in doubt, use
      the transitive version gist:isPartOf.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is direct part of
    mappings:
    - gist:isDirectPartOf
    is_a: is_part_of
    slot_uri: gist:isDirectPartOf
    range: string
    multivalued: true
  is_expressed_in:
    name: is_expressed_in
    definition_uri: https://w3id.org/lmodel/gist/is_expressed_in
    annotations:
      domain_includes:
        tag: domain_includes
        value: gist:Text
      range_includes:
        tag: range_includes
        value: gist:Language
    description: Relates something to the language it is expressed in.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is expressed in
    mappings:
    - gist:isExpressedIn
    domain: Text
    slot_uri: gist:isExpressedIn
    owner: is_expressed_in
    range: Language
    multivalued: true
    inlined: true
    inlined_as_list: true
  is_first_member_of:
    name: is_first_member_of
    definition_uri: https://w3id.org/lmodel/gist/is_first_member_of
    description: Relates the first member of an ordered collection to the collection.
    comments:
    - Given the Open World Assumption, the absence of a predecessor does not entail
      that an ordered member is the first member of an ordered collection. This property
      is used to explicitly indicate the first member. Since ordered collections need
      not be strictly ordered, there can be more than one first member.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is first member of
    mappings:
    - gist:isFirstMemberOf
    is_a: is_member_of
    domain: OrderedMember
    slot_uri: gist:isFirstMemberOf
    owner: is_first_member_of
    range: OrderedCollection
    multivalued: false
    inlined: true
    inlined_as_list: true
  is_geo_contained_in:
    name: is_geo_contained_in
    definition_uri: https://w3id.org/lmodel/gist/is_geo_contained_in
    description: Relates one geographic location to another that contains it.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is geographically contained in
    mappings:
    - gist:isGeoContainedIn
    domain: GeoLocation
    slot_uri: gist:isGeoContainedIn
    owner: is_geo_contained_in
    transitive: true
    range: GeoLocation
    multivalued: true
    inlined: true
    inlined_as_list: true
  is_governed_by:
    name: is_governed_by
    definition_uri: https://w3id.org/lmodel/gist/is_governed_by
    description: Relates an entity to another entity that controls, directs, determines
      or has a guiding influence or authority over it.
    examples:
    - value: A country geographic region is governed by a country government; the
        installation and use of software is governed by a license.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is governed by
    mappings:
    - gist:isGovernedBy
    slot_uri: gist:isGovernedBy
    range: string
    multivalued: true
  is_identified_by:
    name: is_identified_by
    definition_uri: https://w3id.org/lmodel/gist/is_identified_by
    annotations:
      owl_inverse_functional:
        tag: owl_inverse_functional
        value: true
    description: Relates something to a content object that uniquely identifies it.
    comments:
    - 'This is like a URI: a thing can have more than one ID, but each ID can refer
      to only one thing. Note that it is possible to have two IDs with the same text
      that refer to different things.'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is identified by
    mappings:
    - gist:isIdentifiedBy
    slot_uri: gist:isIdentifiedBy
    range: ID
    multivalued: true
    inlined: true
    inlined_as_list: true
  is_made_up_of:
    name: is_made_up_of
    definition_uri: https://w3id.org/lmodel/gist/is_made_up_of
    description: Relates something to a substance that it is made up of.
    examples:
    - value: A vase is made of clay; water is made up of hydrogen and oxygen.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is made up of
    mappings:
    - gist:isMadeUpOf
    slot_uri: gist:isMadeUpOf
    range: PhysicalSubstance
    multivalued: true
    inlined: true
    inlined_as_list: true
  is_member_of:
    name: is_member_of
    definition_uri: https://w3id.org/lmodel/gist/is_member_of
    annotations:
      range_includes:
        tag: range_includes
        value: gist:Collection, gist:Organization
    description: Relates a member individual to the thing, such as a collection or
      organization, that it is a member of.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is member of
    mappings:
    - gist:isMemberOf
    slot_uri: gist:isMemberOf
    range: string
    multivalued: true
    any_of:
    - range: Collection
    - range: Organization
  is_part_of:
    name: is_part_of
    definition_uri: https://w3id.org/lmodel/gist/is_part_of
    description: The relationship between a part and a whole where the part has independent
      existence.
    comments:
    - Because the part has independent existence, there is no cascading delete.
    - The transitive version of gist:isDirectPartOf.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is part of
    mappings:
    - gist:isPartOf
    slot_uri: gist:isPartOf
    transitive: true
    range: string
    multivalued: true
  is_produced_by:
    name: is_produced_by
    definition_uri: https://w3id.org/lmodel/gist/is_produced_by
    description: Relates something to the thing that created, composed, or brought
      it into existence.
    examples:
    - value: A deliverable is produces by a task.
    - value: A measurement is produced by a sensor.
    - value: A painting is produced by a person.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is produced by
    mappings:
    - gist:isProducedBy
    slot_uri: gist:isProducedBy
    range: string
    multivalued: true
  is_recognized_by:
    name: is_recognized_by
    definition_uri: https://w3id.org/lmodel/gist/is_recognized_by
    description: Relates something to a party that formally acknowledges its existence,
      validity, or legality.
    examples:
    - value: The existence of a particular company is recognized by the state.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is recognized by
    mappings:
    - gist:isRecognizedBy
    slot_uri: gist:isRecognizedBy
    range: string
    multivalued: true
    any_of:
    - range: Organization
    - range: Person
  is_rendered_on:
    name: is_rendered_on
    definition_uri: https://w3id.org/lmodel/gist/is_rendered_on
    description: Relates content to the media on which it is rendered.
    examples:
    - value: A document is rendered on a computer screen; a piece of music is rendered
        through speakers.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is rendered on
    mappings:
    - gist:isRenderedOn
    slot_uri: gist:isRenderedOn
    range: string
    multivalued: true
  is_triggered_by:
    name: is_triggered_by
    definition_uri: https://w3id.org/lmodel/gist/is_triggered_by
    description: Relates a contingency, such as an event or obligation, to the event
      that gives rise to it.
    comments:
    - For obligations, this property describes what must happen to trigger the contingent
      obligation. Other uses include controls, processes, etc.
    examples:
    - value: Fire insurance is contingent on a particular building burning down; the
        death benefit payout on a life insurance policy is contingent on the death
        of the insured person.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is triggered by
    mappings:
    - gist:isTriggeredBy
    slot_uri: gist:isTriggeredBy
    range: string
    multivalued: true
  is_under_jurisdiction_of:
    name: is_under_jurisdiction_of
    definition_uri: https://w3id.org/lmodel/gist/is_under_jurisdiction_of
    annotations:
      range_includes:
        tag: range_includes
        value: gist:GovernmentOrganization
    description: Relates a law, contract, etc., to the system of law or government
      which has the power, right, or authority to interpret and apply it.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is under jurisdiction of
    mappings:
    - gist:isUnderJurisdictionOf
    slot_uri: gist:isUnderJurisdictionOf
    range: GovernmentOrganization
    multivalued: true
    inlined: true
    inlined_as_list: true
  links:
    name: links
    definition_uri: https://w3id.org/lmodel/gist/links
    annotations:
      domain_includes:
        tag: domain_includes
        value: gist:NetworkLink
      range_includes:
        tag: range_includes
        value: gist:NetworkNode
    description: Relates a network link to a network node that it connects to another
      node. Used when the connection is undirected or the direction is not known.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - links
    mappings:
    - gist:links
    domain: NetworkLink
    slot_uri: gist:links
    owner: links
    range: NetworkNode
    multivalued: true
    inlined: true
    inlined_as_list: true
  links_from:
    name: links_from
    definition_uri: https://w3id.org/lmodel/gist/links_from
    annotations:
      domain_includes:
        tag: domain_includes
        value: gist:NetworkLink
      range_includes:
        tag: range_includes
        value: gist:NetworkNode
    description: Relates a network link to its origin network node. Unlike the superproperty,
      this represents a directed connection.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - links from
    mappings:
    - gist:linksFrom
    is_a: links
    domain: NetworkLink
    slot_uri: gist:linksFrom
    owner: links_from
    range: NetworkNode
    multivalued: true
    inlined: true
    inlined_as_list: true
  links_to:
    name: links_to
    definition_uri: https://w3id.org/lmodel/gist/links_to
    annotations:
      domain_includes:
        tag: domain_includes
        value: gist:NetworkLink
      range_includes:
        tag: range_includes
        value: gist:NetworkNode
    description: Relates a network link to its destination network node. Unlike the
      superproperty, this represents a directed connection.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - links to
    mappings:
    - gist:linksTo
    is_a: links
    domain: NetworkLink
    slot_uri: gist:linksTo
    owner: links_to
    range: NetworkNode
    multivalued: true
    inlined: true
    inlined_as_list: true
  occurs_in:
    name: occurs_in
    definition_uri: https://w3id.org/lmodel/gist/occurs_in
    description: Relates something, such as an event, to the geographic location where
      it did, does, or will happen.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - occurs in
    mappings:
    - gist:occursIn
    slot_uri: gist:occursIn
    range: string
    multivalued: true
  offers_to_provide:
    name: offers_to_provide
    definition_uri: https://w3id.org/lmodel/gist/offers_to_provide
    annotations:
      domain_includes:
        tag: domain_includes
        value: gist:Offer
    description: Relates an offer to the thing being made available for exchange.
    comments:
    - This will most often be a good or service, but could be an amount of money,
      e.g., for currency exchange.
    examples:
    - value: An offer to provide a specific product in exchange for an amount of money
        or to pay a certain price for a home that is for sale.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - offers to provide
    mappings:
    - gist:offersToProvide
    domain: Offer
    slot_uri: gist:offersToProvide
    owner: offers_to_provide
    range: string
    multivalued: true
  offers_to_receive:
    name: offers_to_receive
    definition_uri: https://w3id.org/lmodel/gist/offers_to_receive
    annotations:
      domain_includes:
        tag: domain_includes
        value: gist:Offer
    description: Relates an offer to the thing expected in return for the offered
      item.
    comments:
    - This will most often be an amount of money, but could be anything of value,
      as in swaps.
    examples:
    - value: A vendor makes an offer to receive a particular amount of money in exchange
        for the offered product; an offer to receive a home in exchange for an amount
        of money.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - offers to receive
    mappings:
    - gist:offersToReceive
    domain: Offer
    slot_uri: gist:offersToReceive
    owner: offers_to_receive
    range: string
    multivalued: true
  owns:
    name: owns
    definition_uri: https://w3id.org/lmodel/gist/owns
    description: Relates a party to something that it possesses and controls.
    notes:
    - 'OWL domain: (gist:Organization | gist:Person)'
    comments:
    - The ultimate form of ownership is the right to destroy.
    - There is a long list of potential range classes.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - owns
    mappings:
    - gist:owns
    slot_uri: gist:owns
    range: string
    multivalued: true
  precedes:
    name: precedes
    definition_uri: https://w3id.org/lmodel/gist/precedes
    description: A generic ordering relation indicating that the subject comes before
      the object.
    comments:
    - The less-than symbol is often used to represent this relation.
    - This is the transitive version of gist:precedesDirectly.
    - Typically this predicate would be used asymmetrically and irreflexively, but
      the ontology does not formalize this.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - precedes
    mappings:
    - gist:precedes
    slot_uri: gist:precedes
    transitive: true
    range: string
    multivalued: true
  precedes_directly:
    name: precedes_directly
    definition_uri: https://w3id.org/lmodel/gist/precedes_directly
    description: A generic ordering relation indicating that the subject comes immediately
      before the object.
    comments:
    - If two items in an ordered collection share the same position, they both directly
      precede the following element.
    - It is safest to use this property only when the directness has a semantic correspondence
      with the world. Only break a direct link by inserting an intermediate item when
      that change corresponds to a change in the world.
    - Typically this predicate would be used asymmetrically and irreflexively, but
      the ontology does not formalize this.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - precedes directly
    mappings:
    - gist:precedesDirectly
    is_a: precedes
    slot_uri: gist:precedesDirectly
    range: string
    multivalued: true
  prevents:
    name: prevents
    definition_uri: https://w3id.org/lmodel/gist/prevents
    description: Relates an intention to behavior that it prohibits.
    deprecated: 'true'
    notes:
    - See guidance on removing this term in the next major release at https://github.com/semanticarts/gist/issues/1380#issuecomment-3617257248
    examples:
    - value: A city ordinance prohibits jaywalking.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    deprecated_element_has_exact_replacement: prohibits
    aliases:
    - prevents
    mappings:
    - gist:prevents
    exact_mappings:
    - gist:prohibits
    domain: Intention
    slot_uri: gist:prevents
    owner: prevents
    range: Behavior
    multivalued: true
    inlined: true
    inlined_as_list: true
  prohibits:
    name: prohibits
    definition_uri: https://w3id.org/lmodel/gist/prohibits
    description: Relates an intention to a behavior that it forbids or seeks to prevent.
    comments:
    - A behavior can be prohibited without being prevented. For example, a speed limit
      may prohibit driving faster than a stated speed but does not always succeed
      in preventing drivers from exceeding that speed.
    examples:
    - value: A city ordinance prohibits jaywalking.
    - value: Private property laws prohibit someone from entering private land marked
        with a 'No Trespassing' sign.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - prohibits
    mappings:
    - gist:prohibits
    domain: Intention
    slot_uri: gist:prohibits
    owner: prohibits
    range: Behavior
    multivalued: true
    inlined: true
    inlined_as_list: true
  provides_order_for:
    name: provides_order_for
    definition_uri: https://w3id.org/lmodel/gist/provides_order_for
    description: Links a member of an ordered collection to the real-world item it
      represents in that collection.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - provides order for
    mappings:
    - gist:providesOrderFor
    domain: OrderedMember
    slot_uri: gist:providesOrderFor
    owner: provides_order_for
    range: string
    multivalued: false
  refers_to:
    name: refers_to
    definition_uri: https://w3id.org/lmodel/gist/refers_to
    description: Relates something to another resource that it points to, indicates,
      or references.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - refers to
    mappings:
    - gist:refersTo
    slot_uri: gist:refersTo
    range: string
    multivalued: true
  requires:
    name: requires
    definition_uri: https://w3id.org/lmodel/gist/requires
    description: The subject needs the object or makes it necessary, mandatory, or
      compulsory.
    comments:
    - "This predicate is defined generally enough to encompass a few different meanings\
      \ of the English word 'requires':\r\n\r\n\t\t1. To need something or to make\
      \ something necessary.\r\n\t\t2. To order or demand something, or to order someone\
      \ to do something, especially because of a rule or law.\r\n\t\t3. To make it\
      \ officially necessary for someone to do something.\r\n\r\n\tImplementations\
      \ requiring a more specific meaning should define subproperties."
    examples:
    - value: Humans require air; solar power requires sunshine.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - requires
    mappings:
    - gist:requires
    slot_uri: gist:requires
    range: string
    multivalued: true
  actual_end_date:
    name: actual_end_date
    definition_uri: https://w3id.org/lmodel/gist/actual_end_date
    description: The actual date that something ended, with precision of one day.
    comments:
    - Used for things where the precision of a date is sufficient, such as most projects,
      tasks, and the like. Recommended usage is to zero out the hours through microseconds
      to avoid spurious precision.
    examples:
    - value: '''2021-06-01T00:00:00-06:00''^^xsd:dateTime'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - actual end date
    mappings:
    - gist:actualEndDate
    is_a: actual_end_date_time
    slot_uri: gist:actualEndDate
    range: datetime
  actual_end_date_time:
    name: actual_end_date_time
    definition_uri: https://w3id.org/lmodel/gist/actual_end_date_time
    description: The actual date and time that something ended, with no implied precision.
    comments:
    - This is an abstraction over the various precisions of actual end time, and is
      not expected to be asserted directly. Values of predicates with different precisions
      can be compared since they are all formally xsd:datetimes.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - actual end date time
    mappings:
    - gist:actualEndDateTime
    is_a: end_date_time
    slot_uri: gist:actualEndDateTime
    range: datetime
  actual_end_microsecond:
    name: actual_end_microsecond
    definition_uri: https://w3id.org/lmodel/gist/actual_end_microsecond
    description: The actual time that something ended, expressed as a system time
      used for timestamps.
    comments:
    - A system time will be as precise as the system can supply, typically at least
      milliseconds, sometimes microseconds. The convention for timestamps, such as
      recording a transaction, is to specify just the end point; the start time is
      rarely needed.
    examples:
    - value: '''2021-06-01T08:03:27.12324-6:00''^^xsd:dateTime'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - actual end microsecond
    mappings:
    - gist:actualEndMicrosecond
    is_a: actual_end_date_time
    slot_uri: gist:actualEndMicrosecond
    range: datetime
  actual_end_minute:
    name: actual_end_minute
    definition_uri: https://w3id.org/lmodel/gist/actual_end_minute
    description: The actual date and time that something ended, with precision of
      one minute.
    comments:
    - Used for things like meetings and time card entries, where the hour and minute
      are important. Recommended usage is to zero out the seconds and microseconds
      to avoid spurious precision.
    examples:
    - value: '''2021-06-01T08:32:00-06:00''^^xsd:dateTime'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - actual end minute
    mappings:
    - gist:actualEndMinute
    is_a: actual_end_date_time
    slot_uri: gist:actualEndMinute
    range: datetime
  actual_end_year:
    name: actual_end_year
    definition_uri: https://w3id.org/lmodel/gist/actual_end_year
    description: The actual date that something ended, with precision of one year.
    comments:
    - Used for things where the precision of a year is sufficient. Recommended usage
      is to zero out the hours through microseconds to avoid spurious precision. Note
      that it is not valid to zero out months and days, so arbitrary values must be
      included.
    examples:
    - value: '''2021-01-01T00:00:00-06:00''^^xsd:dateTime'
    - value: The tenure of the previous chairman of the board ended in 2021.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - actual end year
    mappings:
    - gist:actualEndYear
    is_a: actual_end_date_time
    slot_uri: gist:actualEndYear
    range: datetime
  actual_start_date:
    name: actual_start_date
    definition_uri: https://w3id.org/lmodel/gist/actual_start_date
    description: The actual date that something started, with precision of one day.
    comments:
    - Used for things where the precision of a date is sufficient, such as most projects,
      tasks, and the like. Recommended usage is to zero out the hours through microseconds
      to avoid spurious precision.
    examples:
    - value: '''2021-06-01T00:00:00-06:00''^^xsd:dateTime'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - actual start date
    mappings:
    - gist:actualStartDate
    is_a: actual_start_date_time
    slot_uri: gist:actualStartDate
    range: datetime
  actual_start_date_time:
    name: actual_start_date_time
    definition_uri: https://w3id.org/lmodel/gist/actual_start_date_time
    description: The actual date and time that something started, with no implied
      precision.
    comments:
    - This is an abstraction over the various precisions of actual start time, and
      is not expected to be asserted directly. Values of predicates with different
      precisions can be compared since they are all formally xsd:datetimes.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - actual start date time
    mappings:
    - gist:actualStartDateTime
    is_a: start_date_time
    slot_uri: gist:actualStartDateTime
    range: datetime
  actual_start_microsecond:
    name: actual_start_microsecond
    definition_uri: https://w3id.org/lmodel/gist/actual_start_microsecond
    description: The actual time that something started, expressed as a system time
      used for timestamps.
    comments:
    - A system time will be as precise as the system can supply, typically at least
      milliseconds, sometimes microseconds. The convention for timestamps, such as
      recording a transaction, is to specify just the end point; the start time is
      rarely needed. This property is defined for the cases when you do need to capture
      the runtime of a system process, and is then used in conjunction with gist:actualEndMicrosecond.
    examples:
    - value: '''2021-06-01T08:03:27.12324-6:00''^^xsd:dateTime'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - actual start microsecond
    mappings:
    - gist:actualStartMicrosecond
    is_a: actual_start_date_time
    slot_uri: gist:actualStartMicrosecond
    range: datetime
  actual_start_minute:
    name: actual_start_minute
    definition_uri: https://w3id.org/lmodel/gist/actual_start_minute
    description: The actual date and time that something started, with precision of
      one minute.
    comments:
    - Used for things like meetings and time card entries, where the hour and minute
      are important. Recommended usage is to zero out the seconds and microseconds
      to avoid spurious precision.
    examples:
    - value: '''2021-06-01T08:32:00-06:00''^^xsd:dateTime'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - actual start minute
    mappings:
    - gist:actualStartMinute
    is_a: actual_start_date_time
    slot_uri: gist:actualStartMinute
    range: datetime
  actual_start_year:
    name: actual_start_year
    definition_uri: https://w3id.org/lmodel/gist/actual_start_year
    description: The actual date that something started, with precision of one year.
    comments:
    - Used for things where the precision of a year is sufficient. Recommended usage
      is to zero out the hours through microseconds to avoid spurious precision. Note
      that it is not valid to zero out months and days, so arbitrary values must be
      included.
    examples:
    - value: '''2021-01-01T00:00:00-06:00''^^xsd:dateTime'
    - value: The tenure of the current chairman of the board began in 2021.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - actual start year
    mappings:
    - gist:actualStartYear
    is_a: actual_start_date_time
    slot_uri: gist:actualStartYear
    range: datetime
  at_date_time:
    name: at_date_time
    definition_uri: https://w3id.org/lmodel/gist/at_date_time
    description: The date and time at which something did or will occur, with variants
      for precision, start and end, and actual vs. planned.
    comments:
    - "This is the top level property for asserting time, and is not expected to be\
      \ asserted directly.\r\n\r\nThe subproperties allow the ontologist to do three\
      \ things:\r\n1) Distinguish start and end times.\r\n2) Indicate whether a time\
      \ is planned or actual. This is useful for everything from project management\
      \ to calendar appointments and the like. It is also useful for date effectivities;\
      \ i.e., something valid up to a planned date).\r\n3) Distinguish varying levels\
      \ of precision; sort of a simple version of the Allen functions.\r\n\r\nAll\
      \ datetimes are of the same format: '2021-06-01T08:03:27.12324-6:00'^^xsd:dateTime.\
      \ This is compatible with and a subset of ISO 8601.\r\n\r\nTime zone offset,\
      \ such as -6:00 (of which there are a few dozen) is recognized in the date itself,\
      \ as shown. The actual time zone standard (of which there are 131) may optionally\
      \ be attached to the event or other object itself.\r\n\r\nThere will be many\
      \ historical dates that do not have a time zone offset (e.g., Lincoln's birthday,\
      \ as well as about 75% of all legacy systems), and in that case the offset can\
      \ be omitted.\r\n\r\nThe conventions for precision that are repeated in each\
      \ property name are as follows:\r\n\t- *DateTime is an abstraction over the\
      \ various precisions of its subproperties.\r\n\t- *Date refers to a calendar\
      \ date (e.g., birthdays and invoice dates) and is assumed to have precision\
      \ of one day. Time zone offset is allowed.\r\n\t- *Minute refers to clock time;\
      \ e.g., a meeting will start at 9:15 with a timezone offset. Precision is assumed\
      \ to have precision of one minute.\r\n\t- *Microsecond refers to system time,\
      \ and it will be as precise as the system can supply; typically at least milliseconds,\
      \ sometime microseconds.\r\n"
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - at date time
    mappings:
    - gist:atDateTime
    slot_uri: gist:atDateTime
    range: datetime
  birth_date:
    name: birth_date
    definition_uri: https://w3id.org/lmodel/gist/birth_date
    description: The date some living thing was or will be born, with precision of
      one day.
    comments:
    - This is a subproperty of gist:startDateTime rather than gist:actualStartDate
      because some living things have yet to be born. This property refers to a calendar
      date and is assumed to precision of one day (time zone offset is allowed). It
      is recommended to zero out the hours through microseconds to avoid spurious
      precision. Implementations requiring a birthdate to the minute can define a
      subproperty.
    examples:
    - value: '''2021-06-01T00:00:00-06:00''^^xsd:dateTime'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - birth date
    mappings:
    - gist:birthDate
    is_a: start_date_time
    slot_uri: gist:birthDate
    range: datetime
  contained_text:
    name: contained_text
    definition_uri: https://w3id.org/lmodel/gist/contained_text
    annotations:
      domain_includes:
        tag: domain_includes
        value: gist:Content, gist:ContentExpression, gist:Tag, gist:Text
    description: Relates an entity containing textual information to the string constituting
      that textual information.
    comments:
    - If there are multiple strings associated with an entity, it is an implementation
      decision whether to combine them into a single contained text value or to use
      multiple contained text assertions.
    examples:
    - value: The string associated with a tag or with text content.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - contained text
    mappings:
    - gist:containedText
    slot_uri: gist:containedText
    range: string
  conversion_factor:
    name: conversion_factor
    definition_uri: https://w3id.org/lmodel/gist/conversion_factor
    description: A value that relates a unit of measure to units of the International
      System of Units.
    notes:
    - 'OWL range: (xsd:decimal | xsd:double)'
    comments:
    - "To convert a numeric value from one unit of measure to another, multiply by\
      \ the conversion factor of the first unit and then divide by the conversion\
      \ factor of the second unit.\r\n\r\n\tFor example, to convert 27 feet to yards:\r\
      \n\r\n\t\tthe conversion factor of foot is 0.3048\r\n\t\tthe conversion factor\
      \ of yard is 0.9144\r\n\r\n\t\tso\r\n\r\n\t\t27 feet = (27 x 0.3048) / 0.9144\
      \ = 9 yards"
    examples:
    - value: In the equation 1 inch = 0.0254 meters, the value 0.0254 is the conversion
        factor of inch.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    see_also:
    - gist:conversionOffset
    aliases:
    - conversion factor
    mappings:
    - gist:conversionFactor
    domain: UnitOfMeasure
    slot_uri: gist:conversionFactor
    owner: conversion_factor
    range: string
    multivalued: false
    any_of:
    - range: decimal
    - range: float
  conversion_offset:
    name: conversion_offset
    definition_uri: https://w3id.org/lmodel/gist/conversion_offset
    description: "\r\n\t\tA value used along with a conversion factor to relate a\
      \ unit to its corresponding unit in the International System of Units. In the\
      \ equation below, the conversion offset is 459.669607 and the conversion factor\
      \ is 5/9.\r\n\r\n\t\ty degrees Fahrenheit = (y + 459.669607) x 5/9 degrees Kelvin\r\
      \n\r\n\t\tTo convert from Fahrenheit to Kelvin, first add the offset and then\
      \ multiply by the conversion factor.\r\n\r\n\t\tTo convert from Kelvin to Fahrenheit,\
      \ reverse the steps: first divide by the conversion factor and then subtract\
      \ the offset."
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - conversion offset
    mappings:
    - gist:conversionOffset
    domain: UnitOfMeasure
    slot_uri: gist:conversionOffset
    owner: conversion_offset
    range: decimal
    multivalued: false
  death_date:
    name: death_date
    definition_uri: https://w3id.org/lmodel/gist/death_date
    description: The date some living thing died.
    comments:
    - Refers to a calendar date and is assumed to have precision of one day (time
      zone offset is allowed). Recommended usage is to zero out the hours through
      microseconds to avoid spurious precision. Implementations requiring a death
      date to the minute can define a subproperty.
    examples:
    - value: '''2021-06-01T00:00:00-06:00''^^xsd:dateTime'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - death date
    mappings:
    - gist:deathDate
    is_a: actual_end_date
    slot_uri: gist:deathDate
    range: datetime
  description:
    name: description
    definition_uri: https://w3id.org/lmodel/gist/description
    description: A statement about someone or something's attributes or characteristics.
    comments:
    - This property is used to describe instance data which is not part of the ontology.
      A definition and a description have different semantics. Use skos:definition
      for a statement of the meaning of a thing and gist:description to describe a
      thing's attributes, characteristics, or features.
    examples:
    - value: '''The Empire State Building is a 102-story Art Deco skyscraper in midtown
        Manhattan in New York City. It was designed by Shreve, Lamb & Harmon and built
        from 1930 to 1931.'''
    - value: A person does not have a definition, but might be described as being
        six feet tall with brown hair and blue eyes; an ontology class or taxonomy
        term has a definition.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - description
    mappings:
    - gist:description
    slot_uri: gist:description
    owner: GistThing
    domain_of:
    - GistThing
    range: string
  encrypted_text:
    name: encrypted_text
    definition_uri: https://w3id.org/lmodel/gist/encrypted_text
    description: Encoded text produced from readable data by an algorithm so that
      it can only be understood or restored with a decryption key.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - encrypted text
    mappings:
    - gist:encryptedText
    is_a: contained_text
    slot_uri: gist:encryptedText
    range: string
  end_date_time:
    name: end_date_time
    definition_uri: https://w3id.org/lmodel/gist/end_date_time
    description: The date and time that something ends.
    comments:
    - 'This property is neutral along two dimensions: precision (e.g., day, second,
      millisecond) and actual vs. planned. As such, it will generally not be asserted
      directly except in special cases (e.g., for time intervals).'
    - Values of predicates with different precisions can be compared since they are
      all formally xsd:datetimes.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - end date time
    mappings:
    - gist:endDateTime
    is_a: at_date_time
    slot_uri: gist:endDateTime
    range: datetime
  exponent_of_ampere:
    name: exponent_of_ampere
    definition_uri: https://w3id.org/lmodel/gist/exponent_of_ampere
    description: The exponent of ampere in a product of powers of base units.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    examples:
    - value: "In the equation '1 milliampere = 0.001 x ampere'\r\n\r\n\t\tthe conversionFactor\
        \ for milliampere is 0.001\r\n\t\tthe exponent of ampere is 1\r\n\t\tall other\
        \ exponents are zero\r\n\r\n\t\tEvery member of a unit group containing milliampere\
        \ must be a multiple of ampere."
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - exponent of ampere
    mappings:
    - gist:exponentOfAmpere
    slot_uri: gist:exponentOfAmpere
    range: decimal
  exponent_of_bit:
    name: exponent_of_bit
    definition_uri: https://w3id.org/lmodel/gist/exponent_of_bit
    description: The exponent of bit in a product of powers of base units.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    examples:
    - value: "In the equation '1 megabit per second = 1000000 x bit per second'\r\n\
        \r\n\t\tthe conversion factor for megabit per second is 1000000\r\n\t\tthe\
        \ exponent of bit is 1\r\n\t\tthe exponent of second is -1\r\n\t\tall other\
        \ exponents are zero\r\n\r\n\t\tEvery member of a unit group containing megabit\
        \ per second must be a multiple of bit per second."
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - exponent of bit
    mappings:
    - gist:exponentOfBit
    slot_uri: gist:exponentOfBit
    range: decimal
  exponent_of_candela:
    name: exponent_of_candela
    definition_uri: https://w3id.org/lmodel/gist/exponent_of_candela
    description: The exponent of candela in a product of powers of base units.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    examples:
    - value: "In the equation '1 candlepower = 1 x candela'\r\n\r\n\t\tthe conversion\
        \ factor for candlepower is 1\r\n\t\tthe exponent of candela is 1\r\n\t\t\
        all other exponents are zero\r\n\r\n\t\tEvery member of a unit group containing\
        \ candlepower must be a multiple of candela."
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - exponent of candela
    mappings:
    - gist:exponentOfCandela
    slot_uri: gist:exponentOfCandela
    range: decimal
  exponent_of_kelvin:
    name: exponent_of_kelvin
    definition_uri: https://w3id.org/lmodel/gist/exponent_of_kelvin
    description: The exponent of Kelvin in a product of powers of base units.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    examples:
    - value: "In the equation 'y degrees Fahrenheit = (y + 459.6669607) x 5/9 degrees\
        \ Kelvin'\r\n\r\n\t\tthe conversion offset for degree Fahrenheit is 459.6669607\r\
        \n\t\tthe conversion factor for degree Fahrenheit is 5/9\r\n\t\tthe exponent\
        \ of Kelvin is 1\r\n\t\tall other exponents are zero\r\n\r\n\t\tEvery member\
        \ of a unit group containing degree Fahrenheit will have a similar equation,\
        \ with different offset or conversion factor (or both)."
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - exponent of Kelvin
    mappings:
    - gist:exponentOfKelvin
    slot_uri: gist:exponentOfKelvin
    range: decimal
  exponent_of_kilogram:
    name: exponent_of_kilogram
    definition_uri: https://w3id.org/lmodel/gist/exponent_of_kilogram
    description: The exponent of kilogram in a product of powers of base units.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    examples:
    - value: "In the equation '1 millimole per gram = 1 x mole per kilogram'\r\n\r\
        \n\t\tthe conversion factor for millimole per gram is 1\r\n\t\tthe exponent\
        \ of mole is 1\r\n\t\tthe exponent of kilogram is -1\r\n\t\tall other exponents\
        \ are zero\r\n\r\n\t\tEvery member of a unit group containing millimole per\
        \ gram must be a multiple of mole per kilogram."
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - exponent of kilogram
    mappings:
    - gist:exponentOfKilogram
    slot_uri: gist:exponentOfKilogram
    range: decimal
  exponent_of_meter:
    name: exponent_of_meter
    definition_uri: https://w3id.org/lmodel/gist/exponent_of_meter
    description: The exponent of meter in a product of powers of base units.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    examples:
    - value: "In the equation '1 microgram per milliliter = 0.001 x kilogram per meterCubed'\r\
        \n\r\n\t\tthe conversion factor for microgram per milliliter is 0.001\r\n\t\
        \tthe exponent of kilogram is 1\r\n\t\tthe exponent of meter is -3\r\n\t\t\
        all other exponents are zero\r\n\r\n\t\tEvery member of a unit group containing\
        \ microgram per milliliter must be a multiple of kilogram per meterCubed."
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - exponent of meter
    mappings:
    - gist:exponentOfMeter
    slot_uri: gist:exponentOfMeter
    range: decimal
  exponent_of_mole:
    name: exponent_of_mole
    definition_uri: https://w3id.org/lmodel/gist/exponent_of_mole
    description: The exponent of mole in a product of powers of base units.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    examples:
    - value: "In the equation '1 katal = 1 x mole per second'\r\n\r\n\t\tthe conversion\
        \ factor for katal is 1\r\n\t\tthe exponent of mole is 1\r\n\t\tthe exponent\
        \ of second is -1\r\n\t\tall other exponents are zero\r\n\r\n\t\tEvery member\
        \ of a unit group containing katal must be a multiple of mole per second."
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - exponent of mole
    mappings:
    - gist:exponentOfMole
    slot_uri: gist:exponentOfMole
    range: decimal
  exponent_of_number:
    name: exponent_of_number
    definition_uri: https://w3id.org/lmodel/gist/exponent_of_number
    description: The exponent of number in a product of powers of base units.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    comments:
    - Use when the unit of measure involves a count or other number.
    examples:
    - value: "In the equation '1 beat per minute = 0.016667 x number per second'\r\
        \n\r\n\t\tthe conversion factor for beat per minute is 0.016667\r\n\t\tthe\
        \ exponent of number is 1\r\n\t\tthe exponent of second is -1\r\n\t\tall other\
        \ exponents are zero\r\n\r\n\t\tEvery member of a unit group containing beat\
        \ per minute must be a multiple of number per second."
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - exponent of number
    mappings:
    - gist:exponentOfNumber
    slot_uri: gist:exponentOfNumber
    range: decimal
  exponent_of_other:
    name: exponent_of_other
    definition_uri: https://w3id.org/lmodel/gist/exponent_of_other
    description: Indicates whether a unit of measure can be expressed in terms of
      the standard exponents (as shown in the examples).
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    comments:
    - "Set the value to 0 if the units of measure in the unit group can be expressed\
      \ using the standard set of exponents (as in the examples).\r\n\r\n\t\tOtherwise\
      \ set the value to 1, which typically means the units of measure in the group\
      \ use a logarithmic scale."
    examples:
    - value: Decibel, pH, and octave are units of measure that are logarithmic. Their
        unit groups have exponent of other = 1.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - exponent of other
    mappings:
    - gist:exponentOfOther
    slot_uri: gist:exponentOfOther
    range: decimal
  exponent_of_radian:
    name: exponent_of_radian
    definition_uri: https://w3id.org/lmodel/gist/exponent_of_radian
    description: The exponent of radian in a product of powers of base units.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    examples:
    - value: "In the equation '1 revolution = 6.283 x radian'\r\n\r\n\t\tthe conversion\
        \ factor for revolution is 6.283\r\n\t\tthe exponent of radian is 1\r\n\t\t\
        all other exponents are zero\r\n\r\n\t\tEvery member of a unit group containing\
        \ revolution must be a multiple of radian."
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - exponent of radian
    mappings:
    - gist:exponentOfRadian
    slot_uri: gist:exponentOfRadian
    range: decimal
  exponent_of_second:
    name: exponent_of_second
    definition_uri: https://w3id.org/lmodel/gist/exponent_of_second
    description: The exponent of second in a product of powers of base units.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    examples:
    - value: "In the equation '1 watt-hour = 3600 x kilogram meterSquared per secondSquared'\r\
        \n\r\n\t\tthe conversion factor for watt-hour is 3600\r\n\t\tthe exponent\
        \ of kilogram is 1\r\n\t\tthe exponent of meter is 2\r\n\t\tthe exponent of\
        \ second is -2\r\n\t\tall other exponents are zero\r\n\r\n\t\tEvery member\
        \ of a unit group containing watt-hour must be a multiple of kilogram meterSquared\
        \ per secondSquared."
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - exponent of second
    mappings:
    - gist:exponentOfSecond
    slot_uri: gist:exponentOfSecond
    range: decimal
  exponent_of_steradian:
    name: exponent_of_steradian
    definition_uri: https://w3id.org/lmodel/gist/exponent_of_steradian
    description: The exponent of steradian in a product of powers of base units.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    comments:
    - Steradian is a measure of solid angle.
    examples:
    - value: "In the equation '1 watt per square meter steradian = 1 x kilogram per\
        \ secondCubed steradian'\r\n\r\n\t\tthe conversion factor for watt per square\
        \ meter steradian is 1\r\n\t\tthe exponent of kilogram is 1\r\n\t\tthe exponent\
        \ of second is -3\r\n\t\tthe exponent of steradian is -1\r\n\t\tall other\
        \ exponents are zero\r\n\r\n\t\tEvery member of a unit group containing watt\
        \ per square meter steradian must a multiple of kilogram per secondCubed steradian."
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - exponent of steradian
    mappings:
    - gist:exponentOfSteradian
    slot_uri: gist:exponentOfSteradian
    range: decimal
  exponent_of_us_dollar:
    name: exponent_of_us_dollar
    definition_uri: https://w3id.org/lmodel/gist/exponent_of_us_dollar
    description: The exponent of US Dollar in a product of powers of base units.
    notes:
    - 'OWL domain: (gist:UnitGroup | gist:UnitOfMeasure)'
    comments:
    - The factors for converting from one currency to another change constantly.
    examples:
    - value: "In the equation '1 million dollars per week = 1.65344 x dollar per second'\r\
        \n\r\n\t\tthe conversion factor for million dollars per week is 1.65344\r\n\
        \t\tthe exponent of US Dollar is 1\r\n\t\tthe exponent of second is -1\r\n\
        \t\tall other exponents are zero\r\n\r\n\t\tEvery member of a unit group containing\
        \ million dollars per week must be a multiple of dollar per second."
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - exponent of US dollar
    mappings:
    - gist:exponentOfUSDollar
    slot_uri: gist:exponentOfUSDollar
    range: decimal
  id_text:
    name: id_text
    definition_uri: https://w3id.org/lmodel/gist/id_text
    description: A text string that identifies an individual.
    comments:
    - A common use case would be for preexisting internal company identifiers.
    - Often, there will be just one identifying text string. More would be appropriate
      if the individual had different identifiers, such as employee number and social
      security number. A good way to model that would be to have functional subproperties
      of idText, such as departmentNumber.
    - This property is an alternative to using the property gist:isIdentifiedBy in
      conjunction with instances of the class gist:ID.
    examples:
    - value: The id text for a car is '4Y1SL65848Z411439'; the id text for the HR
        department of some company is H31415.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - id text
    mappings:
    - gist:idText
    slot_uri: gist:idText
    range: string
  is_recorded_at:
    name: is_recorded_at
    definition_uri: https://w3id.org/lmodel/gist/is_recorded_at
    description: The date that something was posted (which is not necessarily the
      date it occurred). It must be after the date of occurrence, but could be before
      or after the planned date.
    comments:
    - Precision may vary according to context.
    examples:
    - value: The date and time a customer payment or stock purchase was posted.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is recorded at
    mappings:
    - gist:isRecordedAt
    is_a: at_date_time
    slot_uri: gist:isRecordedAt
    range: datetime
  latitude:
    name: latitude
    definition_uri: https://w3id.org/lmodel/gist/latitude
    description: Degrees above or below the equator.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - latitude
    mappings:
    - gist:latitude
    domain: GeoPoint
    slot_uri: gist:latitude
    owner: latitude
    range: float
  longitude:
    name: longitude
    definition_uri: https://w3id.org/lmodel/gist/longitude
    description: Degrees from the prime meridian.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - longitude
    mappings:
    - gist:longitude
    domain: GeoPoint
    slot_uri: gist:longitude
    owner: longitude
    range: float
  name:
    name: name
    definition_uri: https://w3id.org/lmodel/gist/name
    description: Relates an individual to (one of) its name(s).
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - name
    mappings:
    - gist:name
    slot_uri: gist:name
    owner: GistThing
    domain_of:
    - GistThing
    range: string
  numeric_value:
    name: numeric_value
    definition_uri: https://w3id.org/lmodel/gist/numeric_value
    description: The actual value of a magnitude.
    notes:
    - 'OWL range: (xsd:byte | xsd:decimal | xsd:double | xsd:float | xsd:int | xsd:integer
      | xsd:long | xsd:negativeInteger | xsd:nonNegativeInteger | xsd:nonPositiveInteger
      | xsd:positiveInteger | xsd:short | xsd:unsignedByte | xsd:unsignedInt | xsd:unsignedLong
      | xsd:unsignedShort | owl:rational | owl:real)'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - numeric value
    mappings:
    - gist:numericValue
    slot_uri: gist:numericValue
    range: string
    any_of:
    - range: integer
    - range: decimal
    - range: float
  planned_end_date:
    name: planned_end_date
    definition_uri: https://w3id.org/lmodel/gist/planned_end_date
    description: The date that something is or was planned to end, with precision
      of one day.
    comments:
    - Used for anything with a planned end date, such as when a lease will expire,
      when an offer is no longer available, etc. Typically a planned date is in the
      future when first captured, but when tasks run late, we leave the plan where
      it was and compare it to the actual. Recommended usage is to zero out the hours
      through microseconds to avoid spurious precision.
    examples:
    - value: '''2021-06-01T00:00:00-06:00''^^xsd:dateTime'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - planned end date
    mappings:
    - gist:plannedEndDate
    is_a: planned_end_date_time
    slot_uri: gist:plannedEndDate
    range: datetime
  planned_end_date_time:
    name: planned_end_date_time
    definition_uri: https://w3id.org/lmodel/gist/planned_end_date_time
    description: The date that something is or was planned to end, with no implied
      precision.
    comments:
    - This is an abstraction over the various precisions of planned end time, and
      is not expected to be asserted directly. Values of predicates with different
      precisions can be compared since they are all formally xsd:datetimes.
    - This property, unlike gist:actualEndDateTime, does not have a subproperty for
      microsecond precision, because planned times typically are not expressed at
      that level of granularity. Typically a planned date is in the future when first
      captured, but when tasks run late, we leave the plan where it was and compare
      it to the actual.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - planned end date time
    mappings:
    - gist:plannedEndDateTime
    is_a: end_date_time
    slot_uri: gist:plannedEndDateTime
    range: datetime
  planned_end_minute:
    name: planned_end_minute
    definition_uri: https://w3id.org/lmodel/gist/planned_end_minute
    description: The date and time that something is or was planned to end, with precision
      of one minute.
    comments:
    - Used for things like meetings and time card entries, where the hour and minute
      are important. Recommended usage is to zero out the seconds and microseconds
      to avoid spurious precision.Typically a planned date is in the future when first
      captured, but when tasks run late, we leave the plan where it was and compare
      it to the actual.
    examples:
    - value: '''2021-06-01T08:32:00-06:00''^^xsd:dateTime'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - planned end minute
    mappings:
    - gist:plannedEndMinute
    is_a: planned_end_date_time
    slot_uri: gist:plannedEndMinute
    range: datetime
  planned_end_year:
    name: planned_end_year
    definition_uri: https://w3id.org/lmodel/gist/planned_end_year
    description: The date that something is or was planned to end, with precision
      of one year.
    comments:
    - Used for anything with a planned end date where precision of one year is sufficient.
      Typically a planned date is in the future when first captured, but when tasks
      run late, we leave the plan where it was and compare it to the actual. Recommended
      usage is to zero out the hours through microseconds to avoid spurious precision.
      Note that it is not valid to zero out months and days, so arbitrary values must
      be included.
    examples:
    - value: '''2021-01-01T00:00:00-06:00''^^xsd:dateTime'
    - value: The automobile manufacturer announced that it will stop producing gas-powered
        vehicles in 2035.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - planned end year
    mappings:
    - gist:plannedEndYear
    is_a: planned_end_date_time
    slot_uri: gist:plannedEndYear
    range: datetime
  planned_start_date:
    name: planned_start_date
    definition_uri: https://w3id.org/lmodel/gist/planned_start_date
    description: The date that something is or was planned to start, with precision
      of one day.
    comments:
    - Used for anything with a planned start date, such as when a lease will start,
      when a configuration becomes available, etc. Typically a planned date is in
      the future when first captured, but when tasks run late, we leave the plan where
      it was and compare it to the actual. Recommended usage is to zero out the hours
      through microseconds to avoid spurious precision.
    examples:
    - value: '''2021-06-01T00:00:00-06:00''^^xsd:dateTime'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - planned start date
    mappings:
    - gist:plannedStartDate
    is_a: planned_start_date_time
    slot_uri: gist:plannedStartDate
    range: datetime
  planned_start_date_time:
    name: planned_start_date_time
    definition_uri: https://w3id.org/lmodel/gist/planned_start_date_time
    description: The date and time that something is or was planned to start, with
      no implied precision.
    comments:
    - This is an abstraction over the various precisions of planned start time, and
      is not expected to be asserted directly. Values of predicates with different
      precisions can be compared since they are all formally xsd:datetimes.
    - This property, unlike gist:actualStartDateTime, does not have a subproperty
      for microsecond precision, because planned times typically are not expressed
      at that level of granularity. Typically a planned date is in the future when
      first captured, but when tasks run late, we leave the plan where it was and
      compare it to the actual.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - planned start date time
    mappings:
    - gist:plannedStartDateTime
    is_a: start_date_time
    slot_uri: gist:plannedStartDateTime
    range: datetime
  planned_start_minute:
    name: planned_start_minute
    definition_uri: https://w3id.org/lmodel/gist/planned_start_minute
    description: The date and time that something is or was planned to start, with
      precision of one minute.
    comments:
    - Used for things like meetings and time card entries, where the hour and minute
      are important. Typically a planned date is in the future when first captured,
      but when tasks run late, we leave the plan where it was and compare it to the
      actual. Recommended usage is to zero out the seconds and microseconds to avoid
      spurious precision.
    examples:
    - value: '''2021-06-01T08:32:00-06:00''^^xsd:dateTime'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - planned start minute
    mappings:
    - gist:plannedStartMinute
    is_a: planned_start_date_time
    slot_uri: gist:plannedStartMinute
    range: datetime
  planned_start_year:
    name: planned_start_year
    definition_uri: https://w3id.org/lmodel/gist/planned_start_year
    description: The date that something is or was planned to start, with precision
      of one year.
    comments:
    - Used for anything with a planned start date where precision of one year is sufficient.
      Typically a planned date is in the future when first captured, but when tasks
      run late, we leave the plan where it was and compare it to the actual. Recommended
      usage is to zero out the hours through microseconds to avoid spurious precision.
      Note that it is not valid to zero out months and days, so arbitrary values must
      be included.
    examples:
    - value: '''2021-01-01T00:00:00-06:00''^^xsd:dateTime'
    - value: The automobile manufacturer announced that its full line-up will include
        only electric cars starting in 2035.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - planned start year
    mappings:
    - gist:plannedStartYear
    is_a: planned_start_date_time
    slot_uri: gist:plannedStartYear
    range: datetime
  sequence:
    name: sequence
    definition_uri: https://w3id.org/lmodel/gist/sequence
    annotations:
      domain_includes:
        tag: domain_includes
        value: gist:OrderedMember
    description: A number that specifies the position of an element within a series.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - sequence
    mappings:
    - gist:sequence
    domain: OrderedMember
    slot_uri: gist:sequence
    owner: sequence
    range: integer
  start_date_time:
    name: start_date_time
    definition_uri: https://w3id.org/lmodel/gist/start_date_time
    description: The date and time that something starts.
    comments:
    - 'This property is neutral along two dimensions: precision (e.g., day, second,
      millisecond) and actual vs. planned. As such, it will generally not be asserted
      directly except in special cases (e.g., for time intervals).'
    - Values of predicates with different precisions can be compared since they are
      all formally xsd:datetimes.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - start date time
    mappings:
    - gist:startDateTime
    is_a: at_date_time
    slot_uri: gist:startDateTime
    range: datetime
  symbol:
    name: symbol
    definition_uri: https://w3id.org/lmodel/gist/symbol
    annotations:
      domain_includes:
        tag: domain_includes
        value: gist:UnitOfMeasure
    description: A symbol for something using only ASCII characters.
    examples:
    - value: The ASCII symbol for square meter is m^2.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - symbol
    mappings:
    - gist:symbol
    domain: UnitOfMeasure
    slot_uri: gist:symbol
    owner: symbol
    range: string
  unique_text:
    name: unique_text
    definition_uri: https://w3id.org/lmodel/gist/unique_text
    annotations:
      domain_includes:
        tag: domain_includes
        value: gist:ID, gist:MediaType, gist:Tag, gist:Text
    description: The unique string value of some content object, to be used when there
      is no possibility of having more than one value.
    comments:
    - 'Note that the uniqueness only goes in one direction: a product catalog number
      might also be an employee ID.'
    examples:
    - value: The unique string for a vehicle identification number.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - unique text
    mappings:
    - gist:uniqueText
    is_a: contained_text
    slot_uri: gist:uniqueText
    range: string
    multivalued: false
  domain_includes:
    name: domain_includes
    definition_uri: https://w3id.org/lmodel/gist/domain_includes
    description: Relates a property to a class that the property is expected to be
      used on.
    comments:
    - There may be multiple domainIncludes assertions on a single property.
    - This property is used to guide the ontology user; like all annotation properties,
      it does not play a role in inference.
    examples:
    - value: The domain of the property gist:containedText includes gist:Tag and gist:Text.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - domain includes
    mappings:
    - gist:domainIncludes
    related_mappings:
    - http://www.w3.org/2004/02/skos/core#scopeNote
    slot_uri: gist:domainIncludes
    range: string
  is_superseded_by:
    name: is_superseded_by
    definition_uri: https://w3id.org/lmodel/gist/is_superseded_by
    description: Relates a deprecated term to a term that replaces it, which is either
      an exact (in the case of simple renaming) or approximate (in the case of renaming
      and some semantic change) semantic match.
    examples:
    - value: gist:connectedTo was superseded by gist:isConnectedTo (renaming with
        no semantic change).
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - is superseded by
    mappings:
    - gist:isSupersededBy
    slot_uri: gist:isSupersededBy
    range: string
  license:
    name: license
    definition_uri: https://w3id.org/lmodel/gist/license
    description: Relates something to its conditions of use.
    comments:
    - Could refer to a license object by URI or name or could consist of the license
      text itself.
    examples:
    - value: The gist ontology is licensed under the CC By 4.0 license.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - license
    mappings:
    - gist:license
    slot_uri: gist:license
    range: string
  range_includes:
    name: range_includes
    definition_uri: https://w3id.org/lmodel/gist/range_includes
    description: Relates a property to a class that is an expected type of its values.
    comments:
    - There may be multiple rangeIncludes assertions on a single property.
    - This property is used to guide the ontology user; like all annotation properties,
      it does not play a role in inference.
    examples:
    - value: The range of the property gist:isCategorizedBy includes gist:Category.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - range includes
    mappings:
    - gist:rangeIncludes
    related_mappings:
    - http://www.w3.org/2004/02/skos/core#scopeNote
    slot_uri: gist:rangeIncludes
    range: string
classes:
  Account:
    name: Account
    definition_uri: https://w3id.org/lmodel/gist/Account
    description: An agreement having a balance.
    notes:
    - "OWL equivalentClass: (gist:Agreement & \u2203hasMagnitude.\u2203hasAspect=_Aspect_financial_balance)"
    examples:
    - value: A bank account, a credit card account, an accounts receivable account.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Account
    mappings:
    - gist:Account
    close_mappings:
    - common_domain_model:Account
    is_a: Agreement
    slots:
    - name
    - description
    class_uri: gist:Account
  Address:
    name: Address
    definition_uri: https://w3id.org/lmodel/gist/Address
    description: A reference to a place (real or virtual) that can be located by some
      routing algorithm and where messages or things can be sent or received.
    examples:
    - value: A PO Box, a URL to a PDF file.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Address
    mappings:
    - gist:Address
    narrow_mappings:
    - common_domain_model:Address
    is_a: Content
    slots:
    - name
    - description
    class_uri: gist:Address
  AddressUsageType:
    name: AddressUsageType
    definition_uri: https://w3id.org/lmodel/gist/AddressUsageType
    description: A category indicating the context or manner in which an address may
      be used.
    comments:
    - If you are using temporal relations involving addresses, this category should
      be used to qualify the temporal relation rather than the address itself, since
      the same address may have different uses in different contexts, by different
      people and organizations, or at different times.
    examples:
    - value: Billing, business, personal, postal, residence.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Address Usage Type
    mappings:
    - gist:AddressUsageType
    is_a: Category
    slots:
    - name
    - description
    class_uri: gist:AddressUsageType
  Agreement:
    name: Agreement
    definition_uri: https://w3id.org/lmodel/gist/Agreement
    description: A mutually understood arrangement in which two or more parties make
      commitments to one another.
    notes:
    - "OWL equivalentClass: (gist:Intention & \u2203hasParty.(gist:Organization |\
      \ gist:Person) & \u22652^isDirectPartOf.gist:Commitment)"
    comments:
    - While an agreement has two or more parties, and contains commitments which bind
      those parties, it will not always be necessary to instantiate each individual
      commitment.
    examples:
    - value: A gym membership is an agreement in which the member commits to paying
        the gym a certain price and the gym commits to allowing access to their facilities.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Agreement
    mappings:
    - gist:Agreement
    close_mappings:
    - common_domain_model:Agreement
    narrow_mappings:
    - common_domain_model:MasterAgreement
    - dpv:DataProcessingAgreement
    is_a: Intention
    slots:
    - name
    - description
    class_uri: gist:Agreement
  Aspect:
    name: Aspect
    definition_uri: https://w3id.org/lmodel/gist/Aspect
    description: A measurable characteristic.
    comments:
    - Depending on implementation, every aspect should be related to a unit group
      either directly or through a broader aspect. For example, angle of incidence
      could be related to the broader concept of angle, which in turn is related to
      a unit group, or it could be related directly to the unit group without the
      hierarchical relationship.
    - 'Rule of thumb: use the least specific aspect that serves the intended purpose,
      increasing specificity only when required (e.g., to distinguish between two
      magnitudes attached to the same object).'
    examples:
    - value: Length, weight, cost, cycle time, defect rate, wheelbase, billing rate.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Aspect
    mappings:
    - gist:Aspect
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:Aspect
    disjoint_with:
    - Event
  Assignment:
    name: Assignment
    definition_uri: https://w3id.org/lmodel/gist/Assignment
    description: A temporal relationship between an assignee, the thing assigned,
      and the resource that made the assignment.
    notes:
    - "OWL equivalentClass: (gist:TemporalRelation & \u2203hasGiver.owl:Thing & \u2203\
      isAssignmentOf.owl:Thing & \u2203isAssignmentTo.owl:Thing)"
    comments:
    - Based on the Open World Assumption, the assigner may not be asserted or known.
    - For some assignments, such as the assignment of a person to a task, it may seem
      equally correct in ordinary speech to say it is an assignment of a task to a
      person. Since gist:isAssignmentTo and gist:isAssignmentOf have no formal domains
      or ranges, the choice of which predicate to use for which is left as an implementation
      decision. Consistency is a key consideration.
    examples:
    - value: An employee is assigned to a task by a supervisor. A person is assigned
        to a position.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Assignment
    mappings:
    - gist:Assignment
    close_mappings:
    - common_domain_model:NaturalPersonRole
    related_mappings:
    - common_domain_model:RelatedParty
    - common_domain_model:Counterparty
    is_a: TemporalRelation
    slots:
    - name
    - description
    class_uri: gist:Assignment
  Behavior:
    name: Behavior
    definition_uri: https://w3id.org/lmodel/gist/Behavior
    description: A category indicating the nature of an activity.
    examples:
    - value: Drilling and cutting are two different kinds of manufacturing event.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Behavior
    mappings:
    - gist:Behavior
    is_a: Category
    slots:
    - name
    - description
    class_uri: gist:Behavior
  Building:
    name: Building
    definition_uri: https://w3id.org/lmodel/gist/Building
    description: A relatively permanent man-made structure situated on a plot of land,
      having a roof and walls, commonly used for dwelling, entertaining, or working.
    deprecated: 'true'
    comments:
    - 'User discretion can be applied to edge cases: e.g., is a traditional yurt ''relatively
      permanently situated'' although it is portable and has a tent-like construction?'
    examples:
    - value: A house, school, store, factory, chicken coop.
    - value: 'Negative examples: houseboats (not built on land), caves (not man-made),
        food trucks and RVs (not permanently situated).'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Building
    mappings:
    - gist:Building
    is_a: Landmark
    slots:
    - name
    - description
    class_uri: gist:Building
  BundledCatalogItem:
    name: BundledCatalogItem
    definition_uri: https://w3id.org/lmodel/gist/BundledCatalogItem
    description: Any combination of descriptions of things offered together.
    notes:
    - "OWL equivalentClass: (gist:CatalogItem & \u2203^isDirectPartOf.gist:CatalogItem)"
    examples:
    - value: A kit containing several parts offered together; a product plus a warranty.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Bundled Catalog Item
    mappings:
    - gist:BundledCatalogItem
    is_a: CatalogItem
    slots:
    - name
    - description
    class_uri: gist:BundledCatalogItem
  CatalogItem:
    name: CatalogItem
    definition_uri: https://w3id.org/lmodel/gist/CatalogItem
    description: A description of a product or service to be delivered, given in a
      sufficient level of detail that a receiver could determine whether delivery
      constituted discharge of the obligation to deliver.
    comments:
    - In short, an unambiguous characterization of what it is that a potential buyer
      is paying for.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Catalog Item
    mappings:
    - gist:CatalogItem
    is_a: Specification
    slots:
    - name
    - description
    class_uri: gist:CatalogItem
  Category:
    name: Category
    definition_uri: https://w3id.org/lmodel/gist/Category
    description: A concept or label used to categorize other instances without specifying
      any formal semantics.
    notes:
    - "OWL subClassOf restrictions: \u2203isAllocatedBy.(gist:IntellectualProperty\
      \ | gist:Organization | gist:Person)"
    comments:
    - Often a type can be modeled either as an owl:Class or as a gist:Category. Use
      the latter if you don't care much about the formal structure of the different
      types, or if there is a whole hierarchy of types that are going to be managed
      by a group separate from the ontology developers. The formal structure may be
      defined elsewhere and linked to, if necessary.
    examples:
    - value: Tags used in folksonomies; formal definitions from other systems.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Category
    mappings:
    - gist:Category
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:Category
    disjoint_with:
    - Event
  Collection:
    name: Collection
    definition_uri: https://w3id.org/lmodel/gist/Collection
    description: A grouping of things.
    comments:
    - Individuals are placed in the collection using the gist:isMemberOf property.
      Collections typically are created because the members are functionally connected
      in some way. This definition allows a collection to have zero members.
    examples:
    - value: A jury is a group of people; a financial ledger is a collection of transaction
        entries; a route is an (ordered) collection of segments.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Collection
    mappings:
    - gist:Collection
    is_a: Composite
    slots:
    - name
    - description
    class_uri: gist:Collection
  Commitment:
    name: Commitment
    definition_uri: https://w3id.org/lmodel/gist/Commitment
    description: A promise made by a single party to one or more parties to do or
      not do something or act in a particular way.
    notes:
    - "OWL equivalentClass: (gist:Intention & (gist:Requirement | gist:Restriction)\
      \ & \u2203hasGiver.(gist:Organization | gist:Person) & \u2203isCategorizedBy.gist:DegreeOfCommitment)"
    comments:
    - A commitment is unilateral in that it is binding on only one party. This contrasts
      with gist:Agreement, which consists of commitments that bind two or more parties.
    - A single commitment may be made to multiple parties at once; it is a single
      commitment rather than multiple commitments if the same action would fulfill
      the obligation to all the parties simultaneously. For example, a performer makes
      a single commitment to hold a performance to all ticket purchasers; by holding
      the performance, the commitment to all parties is fulfilled in a single action.
    - The manner in which a commitment is binding may vary. In a business context,
      we are typically interested in commitments that are legally binding.
    examples:
    - value: Upon selling a treasury bill, the U.S. government makes a commitment
        to pay the purchaser a stated amount of money at a stated time.
    - value: When signing an NDA, the signatory commits to keeping specified information
        confidential.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Commitment
    mappings:
    - gist:Commitment
    is_a: Intention
    slots:
    - name
    - description
    class_uri: gist:Commitment
  Component:
    name: Component
    definition_uri: https://w3id.org/lmodel/gist/Component
    description: Something that, while having an independent existence, is inherently
      part of or designed to be part of a larger entity, such as a system or network.
    comments:
    - A component may be designed or intended as part of a whole without actually
      being so; e.g., a car steering wheel that is not installed in any car.
    - Many things are in a trivial sense a part of a larger thing, but are not considered
      components because they are not inherently part of that larger thing. For example,
      while a book may be part of a library (a collection of books), it is not inherently
      so, and thus is not a component. A playing card, on the other hand, could be
      considered a component in (member of) a deck of cards. This may be use case-dependent;
      e.g., car parts might be modeled as components in an automobile manufacturing
      context but not in a retail auto parts store.
    - Physical substances, such as ingredients in a cake batter, do not meet the independent
      existence criterion, so are not components.
    - This class is not disjoint with gist:Composite, because a component may itself
      break down into smaller components.
    - This is an abstract class that is not directly instantiated. Users will define
      subclasses that are meaningful to their domain of interest.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Component
    mappings:
    - gist:Component
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:Component
    disjoint_with:
    - PhysicalSubstance
  Composite:
    name: Composite
    definition_uri: https://w3id.org/lmodel/gist/Composite
    description: Something which is made up of various parts or elements that are
      independently identifiable.
    comments:
    - Some composites, like systems, networks, and ordered collections, have internal
      organization, while others, such as unordered collections, typically do not.
    - This class is not disjoint with gist:Component, because a composite can itself
      be a component of a larger composite.
    - This is an abstract class that will not be directly instantiated.
    examples:
    - value: A library (collection of books); a network of pipes and valves; a computer
        network of routers and computers.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Composite
    mappings:
    - gist:Composite
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:Composite
  ContemporaryEvent:
    name: ContemporaryEvent
    definition_uri: https://w3id.org/lmodel/gist/ContemporaryEvent
    description: An event that has started but has not yet ended.
    notes:
    - "OWL equivalentClass: (gist:Event & =1actualStartDateTime & \u22640actualEndDateTime)"
    comments:
    - When the event actually ends, it will cease being contemporary.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Contemporary Event
    mappings:
    - gist:ContemporaryEvent
    is_a: Event
    slots:
    - name
    - description
    class_uri: gist:ContemporaryEvent
  Content:
    name: Content
    definition_uri: https://w3id.org/lmodel/gist/Content
    description: Information available in some medium.
    comments:
    - Categories are not content until they are written down.
    - This class includes both abstract content and its expression, but it must have
      at least one expression in order to be content. For example, the idea a writer
      has for a book is not content until it is expressed in some form, but a single
      content object may have multiple expressions - e.g., the particular print and
      audio editions.
    examples:
    - value: The literary work 'The Adventures of Huckleberry Finn' by Mark Twain,
        independent of any particular edition.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Content
    mappings:
    - gist:Content
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:Content
    disjoint_with:
    - GeoPoint
    - GeoRegion
    - Organization
    - PhysicalIdentifiableItem
    - PhysicalSubstance
    - UnitOfMeasure
  ContentExpression:
    name: ContentExpression
    definition_uri: https://w3id.org/lmodel/gist/ContentExpression
    description: Content reduced to text, audio, etc.
    notes:
    - "OWL subClassOf restrictions: \u2203isCategorizedBy.gist:GeneralMediaType"
    comments:
    - If it contains text (written or spoken), it will be expressed in a language.
    - While the content expression is less abstract than a 'Work,' it is more abstract
      than the specific physical items that render the expression. For example, any
      physical or electronic book with ISBN-13 978-1953649805 is associated with the
      same content expression.
    examples:
    - value: A specific print or audio edition of 'The Adventures of Huckleberry Finn,'
        such as the one identified by ISBN-13 978-1953649805.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Content Expression
    mappings:
    - gist:ContentExpression
    is_a: Content
    slots:
    - name
    - description
    class_uri: gist:ContentExpression
  ContingentEvent:
    name: ContingentEvent
    definition_uri: https://w3id.org/lmodel/gist/ContingentEvent
    description: An event with a probability of happening in the future, and usually
      dependent upon some other event or condition.
    notes:
    - "OWL equivalentClass: (gist:Event & \u2203hasMagnitude.\u2203hasAspect=_Aspect_probability\
      \ & \u2203isTriggeredBy.gist:Event)"
    examples:
    - value: A fire insurance payout is contingent on a particular building burning
        down; selling 20 shares of stock in a given company is contingent on the price
        dropping below $200/share; the death benefit payout on a life insurance policy
        is contingent on the death of the insured person.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Contingent Event
    mappings:
    - gist:ContingentEvent
    is_a: Event
    slots:
    - name
    - description
    class_uri: gist:ContingentEvent
  ContingentObligation:
    name: ContingentObligation
    definition_uri: https://w3id.org/lmodel/gist/ContingentObligation
    description: An obligation that is not yet firm. There is some contingent event
      whose occurrence will cause the obligation to become firm.
    notes:
    - "OWL equivalentClass: (gist:Commitment & \u2203hasGiver.(gist:Organization |\
      \ gist:Person) & \u2203isTriggeredBy.gist:Event)"
    comments:
    - A contingent obligation might have a getter counterparty (as in the case of
      insurance); but it might not (as in the case of an offer).
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Contingent Obligation
    mappings:
    - gist:ContingentObligation
    broad_mappings:
    - dpv:Obligation
    is_a: Commitment
    slots:
    - name
    - description
    class_uri: gist:ContingentObligation
  Contract:
    name: Contract
    definition_uri: https://w3id.org/lmodel/gist/Contract
    description: An agreement which can be enforced by law.
    notes:
    - "OWL equivalentClass: (gist:Agreement & \u2203isUnderJurisdictionOf.gist:GovernmentOrganization)"
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Contract
    mappings:
    - gist:Contract
    related_mappings:
    - dpv:Contract
    is_a: Agreement
    slots:
    - name
    - description
    class_uri: gist:Contract
  ContractTerm:
    name: ContractTerm
    definition_uri: https://w3id.org/lmodel/gist/ContractTerm
    description: A specification of some aspect of a contract.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Contract Term
    mappings:
    - gist:ContractTerm
    narrow_mappings:
    - common_domain_model:CollateralProvisions
    is_a: Specification
    slots:
    - name
    - description
    class_uri: gist:ContractTerm
  ControlledVocabulary:
    name: ControlledVocabulary
    definition_uri: https://w3id.org/lmodel/gist/ControlledVocabulary
    description: A collection of terms approved and managed by some organization or
      person.
    notes:
    - "OWL equivalentClass: (gist:Collection & \u2203isGovernedBy.(gist:Organization\
      \ | gist:Person) & \u2203^isMemberOf.gist:Category)"
    comments:
    - A controlled vocabulary is similar to a skos:ConceptScheme, but it could also
      be used for things that are not concepts, such as organizations, US presidents,
      geographic regions, etc. Hierarchical relationships between instances of the
      controlled vocabulary are possible.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Controlled Vocabulary
    mappings:
    - gist:ControlledVocabulary
    is_a: Collection
    slots:
    - name
    - description
    class_uri: gist:ControlledVocabulary
  CountryGeoRegion:
    name: CountryGeoRegion
    definition_uri: https://w3id.org/lmodel/gist/CountryGeoRegion
    description: A geographic region governed by exactly one country government.
    notes:
    - 'OWL subClassOf restrictions: =1isGovernedBy'
    - "OWL equivalentClass: (gist:GovernedGeoRegion & \u2203isGovernedBy.gist:CountryGovernment)"
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Country Geographic Region
    mappings:
    - gist:CountryGeoRegion
    is_a: GovernedGeoRegion
    slots:
    - name
    - description
    class_uri: gist:CountryGeoRegion
  CountryGovernment:
    name: CountryGovernment
    definition_uri: https://w3id.org/lmodel/gist/CountryGovernment
    description: A government organization which asserts both sovereignty (i.e., it
      is not governed by some other government organization) and governance over an
      entity generally recognized as a country.
    notes:
    - "OWL subClassOf restrictions: =1^isGovernedBy.gist:CountryGeoRegion; \u2264\
      0isGovernedBy.gist:GovernmentOrganization"
    - "OWL equivalentClass: (gist:GovernmentOrganization & \u2203^isGovernedBy.gist:CountryGeoRegion)"
    comments:
    - While a country government may enter into treaties with other country governments,
      there are no governing relationships among the treaty members.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Country Government
    mappings:
    - gist:CountryGovernment
    is_a: GovernmentOrganization
    slots:
    - name
    - description
    class_uri: gist:CountryGovernment
    disjoint_with:
    - SubCountryGovernment
  DegreeOfCommitment:
    name: DegreeOfCommitment
    definition_uri: https://w3id.org/lmodel/gist/DegreeOfCommitment
    description: The difficulty of reversing a commitment.
    examples:
    - value: A car rental typically has a lower degree of commitment than an airfare
        reservation.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Degree Of Commitment
    mappings:
    - gist:DegreeOfCommitment
    is_a: Category
    slots:
    - name
    - description
    class_uri: gist:DegreeOfCommitment
  Determination:
    name: Determination
    definition_uri: https://w3id.org/lmodel/gist/Determination
    description: An event whose purpose is to establish a specific result, value,
      or outcome, usually by research, measuring, evaluating, or calculating.
    examples:
    - value: Measuring the sulfur content of crude oil; evaluating a loan application
        for approval; estimating the price of gas for the next three months; determining
        whether and by how much an interest rate should change; classifying a purchase
        into a budget category.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Determination
    mappings:
    - gist:Determination
    close_mappings:
    - iso22989:Decision
    is_a: Event
    slots:
    - name
    - description
    class_uri: gist:Determination
  Discipline:
    name: Discipline
    definition_uri: https://w3id.org/lmodel/gist/Discipline
    description: An area of study or practice.
    examples:
    - value: Finance, accounting, project management, acoustics, ballistics.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Discipline
    mappings:
    - gist:Discipline
    is_a: Category
    slots:
    - name
    - description
    class_uri: gist:Discipline
  ElectronicAddress:
    name: ElectronicAddress
    definition_uri: https://w3id.org/lmodel/gist/ElectronicAddress
    description: An address referring to a locatable virtual place that does not physically
      exist but is made by software or electronics to appear to do so.
    examples:
    - value: A file system path, website URL, IP address, email address, mobile or
        landline telephone number.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Electronic Address
    - Virtual Address
    mappings:
    - gist:ElectronicAddress
    related_mappings:
    - common_domain_model:ContactInformation
    is_a: Address
    slots:
    - name
    - description
    class_uri: gist:ElectronicAddress
    disjoint_with:
    - PhysicalAddress
  ElectronicAddressType:
    name: ElectronicAddressType
    definition_uri: https://w3id.org/lmodel/gist/ElectronicAddressType
    description: A category indicating a kind of electronic address. Such a category
      is usually based on the technology that enables routing to the address referent.
    examples:
    - value: A URL, file system path, email address, mobile telephone number.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Electronic Address Type
    mappings:
    - gist:ElectronicAddressType
    is_a: Category
    slots:
    - name
    - description
    class_uri: gist:ElectronicAddressType
  Equipment:
    name: Equipment
    definition_uri: https://w3id.org/lmodel/gist/Equipment
    description: Human-made, tangible property other than land or buildings used to
      perform a task or activity.
    notes:
    - "OWL equivalentClass: (gist:PhysicalIdentifiableItem & \u2203isCategorizedBy.gist:EquipmentType)"
    examples:
    - value: A machine, a router, a car, a baseball bat.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Equipment
    mappings:
    - gist:Equipment
    is_a: PhysicalIdentifiableItem
    slots:
    - name
    - description
    class_uri: gist:Equipment
  EquipmentType:
    name: EquipmentType
    definition_uri: https://w3id.org/lmodel/gist/EquipmentType
    description: A category of equipment.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Equipment Type
    mappings:
    - gist:EquipmentType
    is_a: Category
    slots:
    - name
    - description
    class_uri: gist:EquipmentType
  Event:
    name: Event
    definition_uri: https://w3id.org/lmodel/gist/Event
    description: Something that occurs over a period of time, often characterized
      as an activity being carried out by some person, organization, or software application
      or brought about by natural forces.
    comments:
    - An event does not necessarily have either planned or actual start or end datetimes.
      For example, a conference can be in the planning phase without any dates selected,
      but is nevertheless an (unscheduled) event. The subclasses of gist:Event state
      particular restrictions on planned and actual start and end dates.
    - An event occurs during a time interval, which is distinct from the event.
    examples:
    - value: A transaction, conference, baseball game, earthquake.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Event
    mappings:
    - gist:Event
    narrow_mappings:
    - common_domain_model:BusinessEvent
    - iso22989:AILifecycleProcess
    - iso22989:DataProcess
    - iso22989:Action
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:Event
    disjoint_with:
    - Language
    - Magnitude
    - TimeInterval
    - UnitOfMeasure
  EventSpecification:
    name: EventSpecification
    definition_uri: https://w3id.org/lmodel/gist/EventSpecification
    description: A characterization of an event that might happen.
    comments:
    - This concept is useful for risk assessment and insurance policies.
    examples:
    - value: An insurance company defines the characteristics of a weather event that
        must be satisfied for it to qualify as a hail storm covered in its homeowner's
        policy; a bank defines the point at which a borrower defaults on a loan.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Event Specification
    mappings:
    - gist:EventSpecification
    is_a: Specification
    slots:
    - name
    - description
    class_uri: gist:EventSpecification
  FormattedContent:
    name: FormattedContent
    definition_uri: https://w3id.org/lmodel/gist/FormattedContent
    description: Content encoded in a specific format, but existing as data independent
      of any particular physical medium.
    notes:
    - "OWL equivalentClass: (gist:ContentExpression & \u2203isExpressedIn.gist:MediaType)"
    comments:
    - Each instance of formatted content is a distinct formatting of some Content.
      Thus, a PDF-formatted version and an HTML-formatted version of the same content
      are separate instances of formatted content.
    examples:
    - value: A document in PDF format; an image in JPEG format.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Formatted Content
    mappings:
    - gist:FormattedContent
    is_a: ContentExpression
    slots:
    - name
    - description
    class_uri: gist:FormattedContent
  Function:
    name: Function
    definition_uri: https://w3id.org/lmodel/gist/Function
    description: The activity that a human-made item is intended to perform.
    examples:
    - value: Transmit electricity, provide ballast, control ambient temperature.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Function
    mappings:
    - gist:Function
    is_a: Intention
    slots:
    - name
    - description
    class_uri: gist:Function
  GeneralMediaType:
    name: GeneralMediaType
    definition_uri: https://w3id.org/lmodel/gist/GeneralMediaType
    description: The real-world media type for content.
    examples:
    - value: Audio, still image, video, textual, physical (e.g., a statue), performance
        (e.g., a play), oil or pastel for a painting.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - General Media Type
    mappings:
    - gist:GeneralMediaType
    is_a: Category
    slots:
    - name
    - description
    class_uri: gist:GeneralMediaType
  GeoLocation:
    name: GeoLocation
    definition_uri: https://w3id.org/lmodel/gist/GeoLocation
    description: A physical location, with the earth as a frame of reference.
    comments:
    - A geographic location may be a point, region, or volume.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Geographic Location
    mappings:
    - gist:GeoLocation
    narrow_mappings:
    - dpv:StorageLocation
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:GeoLocation
  GeoPoint:
    name: GeoPoint
    definition_uri: https://w3id.org/lmodel/gist/GeoPoint
    description: An individual point on or above the Earth's surface, identified by
      latitude, longitude and altitude. Altitude is the distance measured from sea
      level. If altitude is missing, the point is assumed to be at the Earth's surface.
      These points are described using decimal latitude/longitude.
    notes:
    - "OWL equivalentClass: (\u2203hasMagnitude.\u2203hasAspect=_Aspect_altitude &\
      \ \u2203latitude.xsd:double & \u2203longitude.xsd:double)"
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Geographic Point
    mappings:
    - gist:GeoPoint
    is_a: GeoLocation
    slots:
    - name
    - description
    class_uri: gist:GeoPoint
    disjoint_with:
    - IntellectualProperty
    - Intention
    - Language
    - Magnitude
    - Organization
    - PhysicalIdentifiableItem
    - PhysicalSubstance
    - UnitOfMeasure
  GeoRegion:
    name: GeoRegion
    definition_uri: https://w3id.org/lmodel/gist/GeoRegion
    description: A bounded region (or set of regions) on the surface of the Earth.
    notes:
    - "OWL subClassOf restrictions: (gist:GeoLocation & \u2203hasMagnitude.\u2203\
      hasAspect=_Aspect_area)"
    comments:
    - A geographic region could be non-contiguous; e.g., the region governed by the
      US federal government is the contiguous area of the lower 48 states plus Alaska,
      Hawaii, and overseas territories. Child classes in lower ontologies can make
      this distinction.
    examples:
    - value: The bounded shape that defines the region occupied by Crater Lake; the
        bounded area known as the contiguous USA.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Geographic Region
    mappings:
    - gist:GeoRegion
    is_a: GeoLocation
    slots:
    - name
    - description
    class_uri: gist:GeoRegion
    disjoint_with:
    - IntellectualProperty
    - Intention
    - Language
    - Magnitude
    - Organization
    - PhysicalIdentifiableItem
    - PhysicalSubstance
    - Template
    - UnitOfMeasure
  GeoRoute:
    name: GeoRoute
    definition_uri: https://w3id.org/lmodel/gist/GeoRoute
    description: An ordered set of geographic points that defines a path from a starting
      point to an ending point.
    notes:
    - "OWL equivalentClass: (gist:OrderedCollection & \u2203^isMemberOf.gist:GeoPoint)"
    comments:
    - A geographic route could describe a bus route by identifying the points where
      the bus stops. A geographic route could describe the boundary of a polygonal
      geographic region (it does not have to be a traveled route).
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Geographic Route
    mappings:
    - gist:GeoRoute
    is_a: OrderedCollection
    slots:
    - name
    - description
    class_uri: gist:GeoRoute
  GeoVolume:
    name: GeoVolume
    definition_uri: https://w3id.org/lmodel/gist/GeoVolume
    description: A three-dimensional space on or near the surface of the Earth.
    notes:
    - "OWL equivalentClass: (gist:GeoLocation & \u2203hasMagnitude.\u2203hasAspect=_Aspect_volume\
      \ & \u2203^isGeoContainedIn.gist:GeoPoint)"
    examples:
    - value: An oil reservoir, the body of a lake, or an airspace.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Geographic Volume
    mappings:
    - gist:GeoVolume
    is_a: GeoLocation
    slots:
    - name
    - description
    class_uri: gist:GeoVolume
  GovernedGeoRegion:
    name: GovernedGeoRegion
    definition_uri: https://w3id.org/lmodel/gist/GovernedGeoRegion
    description: A geographic region governed by at least one government organization.
    notes:
    - "OWL equivalentClass: (gist:GeoRegion & \u2203isGovernedBy.gist:GovernmentOrganization)"
    comments:
    - Geographic regions do not need not be physically contiguous in order to constitute
      a governed geographic region; e.g., Alaska and Hawaii are part of the region
      governed by the United States.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Governed Geographic Region
    mappings:
    - gist:GovernedGeoRegion
    is_a: GeoRegion
    slots:
    - name
    - description
    class_uri: gist:GovernedGeoRegion
  GovernmentOrganization:
    name: GovernmentOrganization
    definition_uri: https://w3id.org/lmodel/gist/GovernmentOrganization
    description: An independent organization exercising political and/or regulatory
      authority over a political unit, people, geographical region, etc., as well
      as performing certain functions for this unit or body.
    comments:
    - Includes administrative, regulatory, and enforcement organizations created or
      sanctioned by country or sub-country governments.
    examples:
    - value: 'Negative example: A corporation, which is owned and therefore not independent.'
    - value: The State of Washington Office of Financial Management; the Food and
        Drug Administration; the Scottish Parliament.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Government Organization
    mappings:
    - gist:GovernmentOrganization
    broad_mappings:
    - common_domain_model:LegalEntity
    is_a: Organization
    slots:
    - name
    - description
    class_uri: gist:GovernmentOrganization
    disjoint_with:
    - IntergovernmentalOrganization
  HistoricalEvent:
    name: HistoricalEvent
    definition_uri: https://w3id.org/lmodel/gist/HistoricalEvent
    description: An event which occurred in time, with an actual end earlier than
      the present moment.
    notes:
    - "OWL subClassOf restrictions: \u2203actualStartDateTime.xsd:dateTime"
    - "OWL equivalentClass: (gist:Event & \u2203actualEndDateTime.xsd:dateTime)"
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Historical Event
    mappings:
    - gist:HistoricalEvent
    is_a: Event
    slots:
    - name
    - description
    class_uri: gist:HistoricalEvent
  ID:
    name: ID
    definition_uri: https://w3id.org/lmodel/gist/ID
    description: Content that is used to uniquely identify something or someone.
    notes:
    - "OWL equivalentClass: (gist:Content & \u2203isAllocatedBy.(gist:IntellectualProperty\
      \ | gist:Organization | gist:Person) & \u2203uniqueText.xsd:string)"
    comments:
    - Used in conjunction with gist:isIdentifiedBy.
    examples:
    - value: SSN for a person; serial number for a product; employee ID for a person.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - ID
    mappings:
    - gist:ID
    close_mappings:
    - common_domain_model:Identifier
    - common_domain_model:AssignedIdentifier
    narrow_mappings:
    - common_domain_model:PartyIdentifier
    - common_domain_model:PersonIdentifier
    - common_domain_model:EntityIdentifier
    is_a: Content
    slots:
    - name
    - description
    class_uri: gist:ID
  IntellectualProperty:
    name: IntellectualProperty
    definition_uri: https://w3id.org/lmodel/gist/IntellectualProperty
    description: An intangible work, invention, or concept, independent of its being
      expressed in text, audio, video, image, or live performance. IP can also be
      tacit knowledge, know-how, or skill.
    comments:
    - For literature this could be called the 'Work,' except that 'work' is a highly
      overloaded term (expenditure of energy, resource consumption, art). Often the
      first expression precedes our recognition of the IP, but subsequent expressions
      are known to be derivatives of the IP, even if they are expression-to-expression
      translations (or copies).
    - This concept includes works that are out of copyright or were never formally
      registered; the defining feature is not that it is legally protected but that
      it is an intangible creation of the human mind.
    examples:
    - value: The Old Man and The Sea; the Page Rank algorithm; the brand Coca Cola.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Intellectual Property
    mappings:
    - gist:IntellectualProperty
    related_mappings:
    - dpv:IntellectualPropertyData
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:IntellectualProperty
    disjoint_with:
    - Magnitude
    - Organization
    - PhysicalIdentifiableItem
    - PhysicalSubstance
    - UnitOfMeasure
  Intention:
    name: Intention
    definition_uri: https://w3id.org/lmodel/gist/Intention
    description: A goal, desire, or aspiration.
    comments:
    - The 'teleological' aspect of a system that indicates things are done with a
      purpose.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Intention
    mappings:
    - gist:Intention
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:Intention
    disjoint_with:
    - Magnitude
    - Organization
    - PhysicalIdentifiableItem
    - PhysicalSubstance
    - UnitOfMeasure
  IntergovernmentalOrganization:
    name: IntergovernmentalOrganization
    definition_uri: https://w3id.org/lmodel/gist/IntergovernmentalOrganization
    description: An organization whose members are government organizations. This
      can comprise regional, municipal, state/province, or national level entities.
    notes:
    - "OWL equivalentClass: (gist:Organization & \u22652^isMemberOf.gist:GovernmentOrganization)"
    examples:
    - value: The United Nations, the European Union, the Metropolitan Transit Authority.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Intergovernmental Organization
    mappings:
    - gist:IntergovernmentalOrganization
    is_a: Organization
    slots:
    - name
    - description
    class_uri: gist:IntergovernmentalOrganization
  KnowledgeConcept:
    name: KnowledgeConcept
    definition_uri: https://w3id.org/lmodel/gist/KnowledgeConcept
    description: An abstract concept that arises from the distillation of experience.
      It is similar to a category but, rather than being a simple tag, it has rich
      structure.
    comments:
    - "Some knowledge is about specific instances that already exist in the knowledge\
      \ graph. We may have knowledge that Judge Jones is more lenient on repeat offenders\
      \ in the morning; we may know that the earliest killing frost in Fort Collins\
      \ is the last week of September.\r\n\r\nThese fit the broader definition of\
      \ knowledge, the distillation of experience. But they do not require any new\
      \ instances. Judge Jones and Fort Collins already exist and have a place in\
      \ our knowledge graph.\r\n\r\nBut some knowledge requires that we synthesize\
      \ new instances in order to have a place to consolidate the knowledge. A disease\
      \ isn't a tangible thing, like a person or a building. A disease is a prediction\
      \ that a person's health will decline in a predictable way (without treatment\
      \ and with treatment). The number of diseases continues to grow as we collectively\
      \ learn more and more granular distinctions. Lung cancer used to be a single\
      \ disease, but now we have dozens of fine-grained distinctions; e.g., non-lymphoma\
      \ small cell fusiform is different from alveolar adenocarcinoma because we now\
      \ know the prognosis and treatment are different.\r\n\r\nThis superclass is\
      \ meant as a place for subclasses that will have the instances that represent\
      \ the foci of the knowledge we have acquired. Note the distinction between a\
      \ particular portion of, say, gold, which instantiates gist:PhysicalSubstance,\
      \ and the concept of gold, which instantiates gist:KnowledgeConcept.\r\n\r\n\
      In some ontologies what we are calling knowledge concepts are defined as classes;\
      \ e.g., non-lymphoma small cell fusiform and alveolar adenocarcinoma would be\
      \ two classes rather than two instances. But using a class makes it harder to\
      \ connect the concept to other instances in a knowledge graph, and furthermore\
      \ such classes would lack instances."
    examples:
    - value: Most domains will define a few subclasses, such as gene, protein, chemical,
        disease, subject matter, industry, method.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Knowledge Concept
    mappings:
    - gist:KnowledgeConcept
    related_mappings:
    - iso22989:KnowledgeGraph
    is_a: IntellectualProperty
    slots:
    - name
    - description
    class_uri: gist:KnowledgeConcept
  Landmark:
    name: Landmark
    definition_uri: https://w3id.org/lmodel/gist/Landmark
    description: Something permanently attached to the Earth.
    deprecated: 'true'
    notes:
    - "OWL subClassOf restrictions: \u2203hasPhysicalLocation.(gist:GeoRegion | gist:GeoVolume)"
    - See guidance on removing the term in the next major release at https://github.com/semanticarts/gist/issues/947#issuecomment-1679566885.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Landmark
    mappings:
    - gist:Landmark
    is_a: PhysicalIdentifiableItem
    slots:
    - name
    - description
    class_uri: gist:Landmark
  Language:
    name: Language
    definition_uri: https://w3id.org/lmodel/gist/Language
    description: A recognized, organized set of symbols and grammar.
    deprecated: 'true'
    examples:
    - value: Natural languages such as English and Spanish; computer languages such
        as OWL, Python, and XML.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Language
    mappings:
    - gist:Language
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:Language
    disjoint_with:
    - Magnitude
    - Organization
    - PhysicalIdentifiableItem
    - PhysicalSubstance
    - UnitOfMeasure
  LivingThing:
    name: LivingThing
    definition_uri: https://w3id.org/lmodel/gist/LivingThing
    description: Something that is currently, or at some point in time was, alive.
    notes:
    - "OWL equivalentClass: (gist:PhysicalIdentifiableItem & \u2203hasBiologicalParent.gist:LivingThing\
      \ & =1birthDate)"
    comments:
    - Not all life forms have exactly two parents, so the restriction only specifies
      a minimum of one.
    examples:
    - value: A cat, a mushroom, a tree.
    - value: 'Negative examples: fictional life forms such as unicorns or Mickey Mouse.'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Living Thing
    mappings:
    - gist:LivingThing
    is_a: PhysicalIdentifiableItem
    slots:
    - name
    - description
    class_uri: gist:LivingThing
  Magnitude:
    name: Magnitude
    definition_uri: https://w3id.org/lmodel/gist/Magnitude
    description: The amount of a measurable characteristic (aspect).
    notes:
    - "OWL equivalentClass: (\u2203hasAspect.gist:Aspect & \u2203hasUnitOfMeasure.gist:UnitOfMeasure\
      \ & \u2203numericValue.rdfs:Literal)"
    comments:
    - An accuracy can be assigned to a magnitude using the property has accuracy.
    examples:
    - value: A model of car could have a wheelbase of 113.2 inches. In this example,
        the aspect is wheelbase, the unit of measure is inch, and the numeric value
        is 113.2.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    see_also:
    - gist:hasAccuracy
    aliases:
    - Magnitude
    mappings:
    - gist:Magnitude
    close_mappings:
    - common_domain_model:Quantity
    - common_domain_model:Measure
    related_mappings:
    - common_domain_model:Price
    narrow_mappings:
    - common_domain_model:Money
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:Magnitude
    disjoint_with:
    - Organization
    - PhysicalIdentifiableItem
    - PhysicalSubstance
    - UnitOfMeasure
  MediaType:
    name: MediaType
    definition_uri: https://w3id.org/lmodel/gist/MediaType
    description: A digitized type that computer applications can recognize.
    notes:
    - "OWL subClassOf restrictions: \u2203uniqueText.xsd:string"
    comments:
    - The unique text for an IANA media type is the concatenation of the 'Type name',
      a slash '/', and the 'Subtype name' as provided on the page displayed when you
      resolve the URI of the media type.
    examples:
    - value: application/sparql-results+xml
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    see_also:
    - https://www.iana.org/assignments/media-types/media-types.xhtml
    aliases:
    - Media Type
    mappings:
    - gist:MediaType
    is_a: Category
    slots:
    - name
    - description
    class_uri: gist:MediaType
  Medium:
    name: Medium
    definition_uri: https://w3id.org/lmodel/gist/Medium
    description: A physical material on which a work can be rendered, represented,
      or implemented.
    examples:
    - value: Paper, clay, a computer monitor.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Medium
    mappings:
    - gist:Medium
    is_a: Category
    slots:
    - name
    - description
    class_uri: gist:Medium
  Message:
    name: Message
    definition_uri: https://w3id.org/lmodel/gist/Message
    description: A specific instance of content sent from a sender to at least one
      other recipient.
    notes:
    - "OWL equivalentClass: (gist:ContentExpression & \u2203comesFromAgent.(gist:Organization\
      \ | gist:Person) & \u2203goesToAgent.(gist:Organization | gist:Person))"
    examples:
    - value: An email, voice, or web service message; a phone call.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Message
    mappings:
    - gist:Message
    is_a: ContentExpression
    slots:
    - name
    - description
    class_uri: gist:Message
  Network:
    name: Network
    definition_uri: https://w3id.org/lmodel/gist/Network
    description: A composite consisting of nodes connected by links.
    notes:
    - "OWL equivalentClass: (gist:Composite & \u2203^isMemberOf.(gist:NetworkLink\
      \ | gist:NetworkNode))"
    examples:
    - value: A physical network could include connected computers or routers, whereas
        a social network would consist of related person or organization members (or
        their proxies, such as accounts).
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Network
    mappings:
    - gist:Network
    is_a: Composite
    slots:
    - name
    - description
    class_uri: gist:Network
  NetworkLink:
    name: NetworkLink
    definition_uri: https://w3id.org/lmodel/gist/NetworkLink
    description: An abstract representation of the connection between two or more
      nodes in a network.
    notes:
    - "OWL subClassOf restrictions: \u2200links.gist:NetworkNode; =2links"
    - "OWL equivalentClass: (gist:Component & \u2203isMemberOf.gist:Network & \u2203\
      links.gist:NetworkNode)"
    comments:
    - Each network link is connected to a network node via the property gist:links
      or one of its subproperties.
    examples:
    - value: A network link may be physical, such as pipes, wired or wireless networks,
        but may also be a link in a non-physical network, such as organizational structures
        or social networks.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Network Link
    mappings:
    - gist:NetworkLink
    is_a: Component
    slots:
    - name
    - description
    class_uri: gist:NetworkLink
  NetworkNode:
    name: NetworkNode
    definition_uri: https://w3id.org/lmodel/gist/NetworkNode
    description: A node in a network.
    notes:
    - "OWL subClassOf restrictions: \u2203isMemberOf.gist:Network"
    examples:
    - value: A person's account is a node in a social network; a valve is a node in
        a network of pipes.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Network Node
    mappings:
    - gist:NetworkNode
    is_a: Component
    slots:
    - name
    - description
    class_uri: gist:NetworkNode
  Offer:
    name: Offer
    definition_uri: https://w3id.org/lmodel/gist/Offer
    description: A contingent commitment to buy, sell, swap or provide one or more
      described or identified goods or services in exchange for another (or others).
    notes:
    - "OWL equivalentClass: (gist:ContingentObligation & \u2203hasGiver.(gist:Organization\
      \ | gist:Person) & \u2203offersToProvide.owl:Thing & \u2203offersToReceive.owl:Thing\
      \ & \u2203plannedEndDateTime.xsd:dateTime & \u2203plannedStartDateTime.xsd:dateTime)"
    comments:
    - Dates on an offer represent the time period the offer is valid for, as in '25%
      off through October 25, 2025.'
    examples:
    - value: An offer to sell a book for a given price; an offer to purchase real
        estate for a particular price; an offer to swap a sea kayak for a mountain
        bike; currency exchange. A donation may be modeled as an offer to receive
        money typically in exchange for $0.00, but sometimes for items of value such
        as coffee mugs or T-shirts.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Offer
    mappings:
    - gist:Offer
    is_a: ContingentObligation
    slots:
    - name
    - description
    class_uri: gist:Offer
  OrderedCollection:
    name: OrderedCollection
    definition_uri: https://w3id.org/lmodel/gist/OrderedCollection
    description: A collection whose members are ordered in some way.
    notes:
    - "OWL equivalentClass: (gist:Collection & (\u2203^isFirstMemberOf.gist:OrderedMember\
      \ | =0^isMemberOf) & \u2200^isMemberOf.gist:OrderedMember)"
    comments:
    - Includes partially ordered collections as well as collections in which members
      occupy the same position in a 'tie.' All members of an ordered collection are
      ordered members.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Ordered Collection
    mappings:
    - gist:OrderedCollection
    is_a: Collection
    slots:
    - name
    - description
    class_uri: gist:OrderedCollection
  OrderedMember:
    name: OrderedMember
    definition_uri: https://w3id.org/lmodel/gist/OrderedMember
    description: A member of an ordered collection serving as a proxy for a real world
      item, which can appear in different orders in different collections. The ordered
      member appears in exactly one ordered collection.
    notes:
    - "OWL equivalentClass: (gist:Component & (\u2203precedesDirectly.gist:OrderedMember\
      \ | \u2203^precedesDirectly.gist:OrderedMember | \u2203sequence.xsd:integer)\
      \ & \u2203providesOrderFor.owl:Thing & \u2200isMemberOf.gist:OrderedCollection\
      \ & =1isMemberOf)"
    comments:
    - An ordered member points to the real world item via the providesOrderFor property.
      Ordering information is represented either as a number in a sequence, or by
      preceding or following another ordered member.
    examples:
    - value: A person may rank 12th in the Boston Marathon but 29th in the New York
        City Marathon.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Ordered Member
    mappings:
    - gist:OrderedMember
    is_a: Component
    slots:
    - name
    - description
    class_uri: gist:OrderedMember
  Organization:
    name: Organization
    definition_uri: https://w3id.org/lmodel/gist/Organization
    description: A structured entity formed to achieve specific goals, typically involving
      members with defined roles.
    comments:
    - Not all organizations have members, e.g. shell companies.
    - While typically the members of organizations are people, in some cases they
      are other organizations; e.g., the members of the United Nations are country
      governments.
    examples:
    - value: Legal entities like companies; non-legal entities like clubs, committees,
        or departments.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Organization
    mappings:
    - gist:Organization
    close_mappings:
    - common_domain_model:LegalEntity
    related_mappings:
    - dpv:ThirdParty
    narrow_mappings:
    - common_domain_model:BusinessUnit
    - dpv:OrganisationalUnit
    - iso22989:Organization
    broad_mappings:
    - common_domain_model:Party
    - dpv:LegalEntity
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:Organization
    disjoint_with:
    - PhysicalIdentifiableItem
    - PhysicalSubstance
    - SchemaMetaData
    - UnitOfMeasure
  Permission:
    name: Permission
    definition_uri: https://w3id.org/lmodel/gist/Permission
    description: A description of things one is permitted to do.
    notes:
    - "OWL equivalentClass: (gist:Intention & \u2203allows.gist:Behavior)"
    examples:
    - value: Permission could be broad, such as free speech, but more often is very
        specific, such as the right to enter a particular property.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Permission
    mappings:
    - gist:Permission
    exact_mappings:
    - dpv:Permission
    is_a: Intention
    slots:
    - name
    - description
    class_uri: gist:Permission
  Person:
    name: Person
    definition_uri: https://w3id.org/lmodel/gist/Person
    description: A human being who was or is alive.
    notes:
    - "OWL subClassOf restrictions: \u2200hasBiologicalParent.gist:Person"
    - "OWL equivalentClass: (gist:LivingThing & \u2203hasBiologicalParent.gist:Person)"
    examples:
    - value: 'Negative example: fictional characters.'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Person
    mappings:
    - gist:Person
    exact_mappings:
    - dpv:NaturalPerson
    close_mappings:
    - common_domain_model:NaturalPerson
    related_mappings:
    - iso22989:AIUser
    - iso22989:DataSubject
    narrow_mappings:
    - dpv:DataSubject
    broad_mappings:
    - common_domain_model:Party
    is_a: LivingThing
    slots:
    - name
    - description
    class_uri: gist:Person
  PhysicalActionType:
    name: PhysicalActionType
    definition_uri: https://w3id.org/lmodel/gist/PhysicalActionType
    description: A category indicating the type of an action based on its effect in
      the physical world.
    examples:
    - value: Lifting a garage door, turning off a valve, dropping cadmium rods.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Physical Action Type
    mappings:
    - gist:PhysicalActionType
    is_a: Category
    slots:
    - name
    - description
    class_uri: gist:PhysicalActionType
  PhysicalAddress:
    name: PhysicalAddress
    definition_uri: https://w3id.org/lmodel/gist/PhysicalAddress
    description: An address that refers to a locatable place within the physical universe.
    notes:
    - "OWL equivalentClass: (gist:Address & \u2203refersTo.gist:GeoLocation)"
    examples:
    - value: 1600 Pennsylvania Avenue NW, Washington, DC 20500; PO Box 7704, San Francisco,
        CA 94120-7704; Room 317 in the Louvre Museum.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Physical Address
    mappings:
    - gist:PhysicalAddress
    close_mappings:
    - common_domain_model:Address
    is_a: Address
    slots:
    - name
    - description
    class_uri: gist:PhysicalAddress
  PhysicalAddressType:
    name: PhysicalAddressType
    definition_uri: https://w3id.org/lmodel/gist/PhysicalAddressType
    description: A category indicating local customary characterizations of physical
      addresses.
    examples:
    - value: Street address, PO box, FPO code.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Physical Address Type
    mappings:
    - gist:PhysicalAddressType
    is_a: Category
    slots:
    - name
    - description
    class_uri: gist:PhysicalAddressType
  PhysicalEvent:
    name: PhysicalEvent
    definition_uri: https://w3id.org/lmodel/gist/PhysicalEvent
    description: An event that can be said to have occurred at some place in space.
    notes:
    - "OWL equivalentClass: (gist:Event & \u2203occursIn.gist:GeoLocation)"
    examples:
    - value: A meeting, a car accident.
    - value: 'Negative examples: Excludes events that have no meaningful location,
        such as financial events or project milestones.'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Physical Event
    mappings:
    - gist:PhysicalEvent
    is_a: Event
    slots:
    - name
    - description
    class_uri: gist:PhysicalEvent
  PhysicalIdentifiableItem:
    name: PhysicalIdentifiableItem
    definition_uri: https://w3id.org/lmodel/gist/PhysicalIdentifiableItem
    description: A discrete physical object which, if subdivided, will result in parts
      that are distinguishable in nature from the whole and in general also from the
      other parts.
    notes:
    - "OWL subClassOf restrictions: \u2203isMadeUpOf.gist:PhysicalSubstance; \u2203\
      hasMagnitude.\u2203hasAspect=_Aspect_mass; \u2203hasMagnitude.\u2203hasAspect=_Aspect_volume"
    comments:
    - This concept generally corresponds to count nouns in English. By contrast, physical
      substances, such as an amount of water, flour, or sand, are mass nouns. Physical
      identifiable items are made up of physical substances; e.g., a cake is made
      up of butter, flour, and sugar; a statue is made of bronze. If you divide a
      physical substance such as an amount of water into parts, you have two amounts
      of water otherwise indistinguishable from one another; if you divide a physical
      identifiable item such as a computer into parts, each part is different from
      the whole.
    examples:
    - value: A laptop, a physical book, a car, a building, a landmark (such as a tree
        stump with an etched marking to denote a campsite).
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Physical Identifiable Item
    mappings:
    - gist:PhysicalIdentifiableItem
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:PhysicalIdentifiableItem
    disjoint_with:
    - SchemaMetaData
    - UnitOfMeasure
  PhysicalSubstance:
    name: PhysicalSubstance
    definition_uri: https://w3id.org/lmodel/gist/PhysicalSubstance
    description: An undifferentiated amount of physical material which, when subdivided,
      results in each part being indistinguishable in nature from the whole and from
      every other part.
    notes:
    - "OWL subClassOf restrictions: \u2203hasMagnitude.\u2203hasAspect=_Aspect_volume;\
      \ \u2203hasMagnitude.\u2203hasAspect=_Aspect_mass"
    comments:
    - An instance of this class has weight and takes up space. We mean the physical
      gold in a ring, not the concept of gold that shows up in the periodic table.
      The latter would be an instance of gist:KnowledgeConcept.
    - This concept generally corresponds to mass nouns in English. By contrast, instances
      of gist:PhysicalIdentifiableItem, such as a computer, book, or car, are count
      nouns. Physical identifiable items are made up of physical substances; e.g.,
      a cake is made up of butter, flour, and sugar; a ring is made of gold. If you
      divide a physical substance such as an amount of water into parts, you have
      different amounts of water otherwise indistinguishable from one another; if
      you divide a physical identifiable item such as a computer into parts, each
      part will be distinguishable from the original whole.
    examples:
    - value: An amount of water, penicillin, sand, or gold.
    - value: 'Negative example: the concept of gold.'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Physical Substance
    mappings:
    - gist:PhysicalSubstance
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:PhysicalSubstance
    disjoint_with:
    - UnitOfMeasure
  ProductCategory:
    name: ProductCategory
    definition_uri: https://w3id.org/lmodel/gist/ProductCategory
    description: Any of many ways of categorizing products.
    examples:
    - value: Automobile models, NATO product codes.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Product Category
    mappings:
    - gist:ProductCategory
    is_a: Category
    slots:
    - name
    - description
    class_uri: gist:ProductCategory
  ProductSpecification:
    name: ProductSpecification
    definition_uri: https://w3id.org/lmodel/gist/ProductSpecification
    description: A description of something that could be physically warehoused or
      digitally stored and physically or digitally delivered.
    notes:
    - "OWL equivalentClass: (gist:CatalogItem & \u2203isCategorizedBy.gist:ProductCategory)"
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Product Specification
    mappings:
    - gist:ProductSpecification
    related_mappings:
    - common_domain_model:TradableProduct
    is_a: CatalogItem
    slots:
    - name
    - description
    class_uri: gist:ProductSpecification
  Project:
    name: Project
    definition_uri: https://w3id.org/lmodel/gist/Project
    description: A task, usually of longer duration, made up of other tasks.
    notes:
    - "OWL equivalentClass: (gist:Task & \u2203^isPartOf.gist:Task)"
    examples:
    - value: Designing an insurance product; adding a new feature to a software application;
        assessing the level of risk for a mortgage application.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Project
    mappings:
    - gist:Project
    is_a: Task
    slots:
    - name
    - description
    class_uri: gist:Project
  ReferenceValue:
    name: ReferenceValue
    definition_uri: https://w3id.org/lmodel/gist/ReferenceValue
    description: A magnitude that was neither measured nor estimated but set by fiat.
    examples:
    - value: The sales goal for a company.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Reference Value
    mappings:
    - gist:ReferenceValue
    is_a: Magnitude
    slots:
    - name
    - description
    class_uri: gist:ReferenceValue
  RenderedContent:
    name: RenderedContent
    definition_uri: https://w3id.org/lmodel/gist/RenderedContent
    description: Content expressed via some physical medium.
    notes:
    - "OWL equivalentClass: (gist:FormattedContent & \u2203isRenderedOn.gist:Medium)"
    comments:
    - Renderings of the same file on two different monitors are separate instances
      of rendered content.
    examples:
    - value: Words printed on paper; audio played on speakers; an image displayed
        on a monitor; an original painting.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Rendered Content
    mappings:
    - gist:RenderedContent
    is_a: FormattedContent
    slots:
    - name
    - description
    class_uri: gist:RenderedContent
  Requirement:
    name: Requirement
    definition_uri: https://w3id.org/lmodel/gist/Requirement
    description: The obligation of a person or organization to behave in a certain
      way.
    examples:
    - value: In the US, drivers must drive on the right side of the road.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Requirement
    mappings:
    - gist:Requirement
    is_a: Intention
    slots:
    - name
    - description
    class_uri: gist:Requirement
  Restriction:
    name: Restriction
    definition_uri: https://w3id.org/lmodel/gist/Restriction
    description: A description of things one is prevented from doing.
    notes:
    - "OWL equivalentClass: (gist:Intention & \u2203prevents.gist:Behavior)"
    examples:
    - value: In the US, tax laws restrict the amount of money a person can put in
        retirement accounts over the course of a year.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Restriction
    mappings:
    - gist:Restriction
    is_a: Intention
    slots:
    - name
    - description
    class_uri: gist:Restriction
  ScheduledEvent:
    name: ScheduledEvent
    definition_uri: https://w3id.org/lmodel/gist/ScheduledEvent
    description: An event with a planned start datetime.
    notes:
    - "OWL equivalentClass: (gist:Event & \u2203plannedStartDateTime.xsd:dateTime)"
    comments:
    - If the event already started, but has not yet ended, it is a contemporary event
      with an actual start datetime. If the event is over, it is a historical event
      having an actual end datetime. The event always retains its planned start datetime,
      and thus continues to be a scheduled event.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Scheduled Event
    mappings:
    - gist:ScheduledEvent
    related_mappings:
    - common_domain_model:Schedule
    is_a: Event
    slots:
    - name
    - description
    class_uri: gist:ScheduledEvent
  ScheduledTask:
    name: ScheduledTask
    definition_uri: https://w3id.org/lmodel/gist/ScheduledTask
    description: A task with a planned start datetime.
    notes:
    - 'Additional named superclasses (modelled as OWL multiple inheritance): Task'
    - 'OWL equivalentClass: (gist:ScheduledEvent & gist:Task)'
    comments:
    - If work on the task has already started, but has not yet ended, it will have
      an actual start datetime. If the task is completed, it will also have an actual
      end datetime. The task always retains its planned start time, and thus continues
      to be a scheduled task.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Scheduled Task
    mappings:
    - gist:ScheduledTask
    is_a: ScheduledEvent
    slots:
    - name
    - description
    class_uri: gist:ScheduledTask
  SchemaMetaData:
    name: SchemaMetaData
    definition_uri: https://w3id.org/lmodel/gist/SchemaMetaData
    description: Superclass for all types of metadata.
    deprecated: 'true'
    comments:
    - The definition of this class needs additional work.
    examples:
    - value: Relational concepts, such as tables and columns; tool inputs, such as
        queries and R2RML maps.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Schema Meta Data
    mappings:
    - gist:SchemaMetaData
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:SchemaMetaData
    disjoint_with:
    - UnitOfMeasure
  ServiceSpecification:
    name: ServiceSpecification
    definition_uri: https://w3id.org/lmodel/gist/ServiceSpecification
    description: A description of something that can be done for a person or organization
      (which produces some form of an act).
    notes:
    - "OWL equivalentClass: (gist:CatalogItem & \u2203^isBasedOn.gist:Event)"
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Service Specification
    mappings:
    - gist:ServiceSpecification
    is_a: CatalogItem
    slots:
    - name
    - description
    class_uri: gist:ServiceSpecification
  Specification:
    name: Specification
    definition_uri: https://w3id.org/lmodel/gist/Specification
    description: The set of characteristics and constraints on their values that specify
      what it means to be a particular type of thing, such as a material, product,
      service or event. A specification is sufficiently precise to allow evaluating
      conformance to the specification.
    comments:
    - Although a characterization of how to do something is often called a specification,
      the intended meaning here is limited to specifying what something is. The focus
      is on the what, not the how. Use gist:TaskTemplate for specifying the how, such
      as a plan or process specification. Use gist:conformsTo to assert that something
      conforms to a specification. To represent a definition of a particular type
      of thing that is not sufficiently precise to be a gist:Specification, consider
      using gist:KnowledgeConcept.
    examples:
    - value: The specification of the iPhone 14; hypothetical events covered by a
        homeowner's insurance policy; a drug quality specification - a set of acceptance
        criteria for quality characteristics that must be controlled to ensure a drug
        is fit for its intended use.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Specification
    mappings:
    - gist:Specification
    related_mappings:
    - common_domain_model:EligibleCollateralCriteria
    is_a: Intention
    slots:
    - name
    - description
    class_uri: gist:Specification
  SubCountryGovernment:
    name: SubCountryGovernment
    definition_uri: https://w3id.org/lmodel/gist/SubCountryGovernment
    description: The government of a governed geographic region other than a country
      which is under the direct or indirect control of a country government.
    notes:
    - "OWL equivalentClass: (gist:GovernmentOrganization & \u2203isGovernedBy.gist:CountryGovernment\
      \ & \u2203^isGovernedBy.gist:GeoRegion)"
    comments:
    - Note that the predicate gist:isGovernedBy is used both for the relationship
      a governed geographic region has to its government and for the relationship
      a sub-region government has to the government of the larger region.
    - There are many types of sub-regions of a country and the governments thereof
      (as well as different terms, like 'province' and 'state,' which refer to essentially
      the same type of thing). We should not automatically assume 'state,' 'county,'
      and 'city.' Subclasses or categories can be defined if greater specificity is
      needed.
    - This class applies only to organizations governing geographic regions. Regulatory
      and bureaucratic organizations are members of the more generic gist:GovernmentOrganization
      class.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Sub-Country Government
    mappings:
    - gist:SubCountryGovernment
    is_a: GovernmentOrganization
    slots:
    - name
    - description
    class_uri: gist:SubCountryGovernment
  System:
    name: System
    definition_uri: https://w3id.org/lmodel/gist/System
    description: A composite made up of interacting or interdependent components that
      together operate as a whole.
    notes:
    - "OWL equivalentClass: (gist:Composite & \u2203^isDirectPartOf.gist:Component)"
    comments:
    - May be used to refer to either man-made or natural systems.
    examples:
    - value: A manufacturing system, a storm system.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - System
    mappings:
    - gist:System
    is_a: Composite
    slots:
    - name
    - description
    class_uri: gist:System
  Tag:
    name: Tag
    definition_uri: https://w3id.org/lmodel/gist/Tag
    description: A term in a folksonomy used to categorize things. Tags can be made
      up on the fly by users.
    notes:
    - "OWL subClassOf restrictions: \u2203containedText.xsd:string"
    comments:
    - Whether to use gist:containedText or gist:uniqueText on tags is an implementation
      decision. Since the latter is a subproperty of the former, the restriction remains
      valid either way.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Tag
    mappings:
    - gist:Tag
    is_a: Category
    slots:
    - name
    - description
    class_uri: gist:Tag
  Task:
    name: Task
    definition_uri: https://w3id.org/lmodel/gist/Task
    description: An activity or piece of work that is either proposed, planned, scheduled,
      underway, or completed.
    notes:
    - "OWL equivalentClass: (gist:Event & \u2203hasGoal.gist:Intention)"
    comments:
    - Something that could potentially be executed, which is merely described but
      not proposed in any specific way, such as a business process for onboarding
      a new employee, or the steps in a recipe for making polyethylene from ethylene,
      is not a task but rather a task template.
    - This term is broader than the English word 'task,' which implies assignment,
      responsibility, or duty. In ordinary English going to a concert has a goal but
      is (generally) done for pleasure rather than out of obligation, and would not
      be considered a task, while according to the gist definition it is a task. The
      expansion of meaning is deliberate, so that anything that has a goal and can
      be specified by a task template is a task.
    - Use the property gist:isBasedOn to link a task back to the task template.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Task
    mappings:
    - gist:Task
    related_mappings:
    - common_domain_model:Workflow
    - iso22989:Task
    is_a: Event
    slots:
    - name
    - description
    class_uri: gist:Task
  TaskTemplate:
    name: TaskTemplate
    definition_uri: https://w3id.org/lmodel/gist/TaskTemplate
    description: An outline of a task of a particular type, which is the basis for
      executing such tasks.
    notes:
    - "OWL equivalentClass: (gist:Template & \u2203hasGoal.gist:Intention)"
    comments:
    - A task template may define a single activity or a series of activities; the
      level of granularity can be varied according to use case. For example, in a
      new employee onboarding process, signing up for benefits might be one activity,
      or it might be broken down into signing up for health insurance, signing up
      for dental insurance, etc.
    - Use the property isBasedOn to link the Task back to the TaskTemplate.
    examples:
    - value: A business process for onboarding new employees.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Task Template
    mappings:
    - gist:TaskTemplate
    is_a: Template
    slots:
    - name
    - description
    class_uri: gist:TaskTemplate
  Template:
    name: Template
    definition_uri: https://w3id.org/lmodel/gist/Template
    description: Something used to make objects in its own image.
    comments:
    - Use gist:isBasedOn to link the object made from the template back to the template.
    examples:
    - value: A die in manufacturing is used to make stamped parts; a form provides
        a structure and fields to be filled in; a cookie cutter is a template for
        cookies.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Template
    mappings:
    - gist:Template
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:Template
    disjoint_with:
    - UnitOfMeasure
  TemporalRelation:
    name: TemporalRelation
    definition_uri: https://w3id.org/lmodel/gist/TemporalRelation
    description: A relationship existing for a period of time.
    notes:
    - "OWL subClassOf restrictions: =1startDateTime; \u22652hasParticipant"
    comments:
    - A temporal relation must have a minimum of two participants. For example, both
      the employer and the employee are participants in a temporal relation representing
      a period of employment. Note that 'participant' does not imply agency; a non-sentient
      being can participate in a temporal relation. For example, both a person and
      a house could be participants in a hypothetical relation 'lives at.'
    examples:
    - value: The relationship between a person and their employer; the relationship
        between a person or business and an address.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Temporal Relation
    mappings:
    - gist:TemporalRelation
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:TemporalRelation
  Text:
    name: Text
    definition_uri: https://w3id.org/lmodel/gist/Text
    description: Content expressed as a written sequence of characters.
    notes:
    - "OWL equivalentClass: (gist:ContentExpression & \u2203isExpressedIn.gist:Language\
      \ & \u2203containedText.xsd:string)"
    comments:
    - Text is expressed in a language (human or computer) and may but need not specify
      an encoding.
    examples:
    - value: 'Negative example: photographs or scans of text are not text. These instead
        depict a subject, which happens to be text.'
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Text
    mappings:
    - gist:Text
    is_a: ContentExpression
    slots:
    - name
    - description
    class_uri: gist:Text
  TimeInterval:
    name: TimeInterval
    definition_uri: https://w3id.org/lmodel/gist/TimeInterval
    description: A span of time with a known start time, end time, and duration. As
      long as two of the three are known, the third can be inferred.
    notes:
    - "OWL subClassOf restrictions: =1startDateTime; =1hasMagnitude.\u2203hasAspect=_Aspect_duration;\
      \ =1endDateTime"
    comments:
    - An ongoing state of affairs with an unknown end time in the future cannot be
      a time interval; e.g. the lifespan of a living person cannot be a time interval,
      as the end time is unknown.
    - This is distinct from a duration, which describes how long a time interval lasts
      (e.g., one hour; 3 days; 22 minutes).
    examples:
    - value: 7pm to 9pm on Jan 1, 2001; fiscal year 2023 (according to some particular
        definition of fiscal year); the week starting at midnight of January 12, 2023
        and lasting exactly 168 hours.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Time Interval
    mappings:
    - gist:TimeInterval
    related_mappings:
    - common_domain_model:Period
    mixins:
    - GistThing
    slots:
    - name
    - description
    class_uri: gist:TimeInterval
  Transaction:
    name: Transaction
    definition_uri: https://w3id.org/lmodel/gist/Transaction
    description: An exchange or transfer of goods, services, or funds.
    comments:
    - Different sorts of transactions can have different datetime precisions. For
      example, an electronic transaction would have a gist:actualEndMicrosecond.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Transaction
    mappings:
    - gist:Transaction
    related_mappings:
    - common_domain_model:Trade
    - common_domain_model:TradeState
    is_a: Event
    slots:
    - name
    - description
    class_uri: gist:Transaction
  UnitGroup:
    name: UnitGroup
    definition_uri: https://w3id.org/lmodel/gist/UnitGroup
    description: A collection of units of measure that can all be used to measure
      the same aspects.
    notes:
    - "OWL subClassOf restrictions: \u2203^isMemberOf.gist:UnitOfMeasure"
    comments:
    - Typically there is one unit group per aspect. An example of an aspect with two
      unit groups is vehicle efficiency, which can be measured by miles per gallon
      (distance per volume) or by liters per 100 kilometers (volume per distance).
      These two units of measure need to be in different unit groups because they
      have different values of exponents. When adding a unit of measure to a unit
      group, make sure it has the same exponents as the other members of the unit
      group.
    examples:
    - value: The units of measure bit, byte, kilobit, kilobyte, etc. are all in the
        same unit group because they can all be used to measure an amount of data.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - Unit Group
    mappings:
    - gist:UnitGroup
    is_a: Collection
    slots:
    - name
    - description
    class_uri: gist:UnitGroup
    disjoint_with:
    - UnitOfMeasure
  UnitOfMeasure:
    name: UnitOfMeasure
