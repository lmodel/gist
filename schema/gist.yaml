    definition_uri: https://w3id.org/lmodel/gist/has_subtrahend
    description: Relates an aspect to another aspect that is a subtracted component
      of it.
    comments:
    - Commonly used with financial metrics.
    examples:
    - value: In the equation 'profit = revenue - expenses', revenue is an addend and
        expenses is a subtrahend.
    in_subset:
    - gist_core
    from_schema: https://w3id.org/lmodel/gist/core
    aliases:
    - has subtrahend
