# Configuration of generators (defaults illustrated)
---
# The directory where the generated files are stored
# directory: "tmp"

# By default all generators are run. Specify here the ones to skip.
# - sqltable, the SQL DDL: the GistThing mixin gives every class gist's 89
#   domain-less slots, so the DDL would hold some 5,400 tables, one for each
#   multivalued slot of each class, and take over five minutes and 4 GB to
#   write.
# - java: the justfile's gen-project recipe runs gen-java after gen-project,
#   so it would write project/java/ twice.
# gen-project ignores a name it does not know, such as markdown: gen-doc
# writes the docs apart.
excludes:
  - markdown
  - sqltable
  - java

# Alternatively only specify the generators to run
# (comment out the above "excludes" section)
# includes:
#   - markdown
#   - excel

# Set the arguments for the generators (no matter if they run or not)
generator_args:
  excel:
    mergeimports: true
  # gist terms keep Semantic Arts' IRIs in every artefact (see the namespace
  # note in scripts/gist_to_linkml.py). gen-owl otherwise declares each class
  # and slot under default_prefix, i.e. a parallel copy of gist in lmodel's
  # namespace, asserts linkml:ClassDefinition on gist's classes, and retypes
  # gist's named individuals as classes.
  # The last three are gen-owl's coming defaults: no restriction that says
  # only what a property's rdfs:range or a minimum of none already says, and
  # one owl:cardinality where the minimum and maximum agree.
  owl:
    mergeimports: true
    metaclasses: false
    type_objects: false
    add_root_classes: false
    mixins_as_expressions: true
    use_native_uris: false
    default_permissible_value_type: owl:NamedIndividual
    skip_vacuous_local_range_axioms: true
    skip_vacuous_min_zero_cardinality_axioms: true
    consolidate_cardinality_axioms: true
  markdown:
    mergeimports: true
    directory: "docs/elements"
  graphql:
    mergeimports: true
  jsonld:
    mergeimports: true
  # Each definition and property takes gist's label as its title, not its
  # LinkML name.
  jsonschema:
    mergeimports: true
    title_from: title
  jsonldcontext:
    mergeimports: true
  # gen-pydantic is not yet supported by gen-project.
  #   https://github.com/linkml/linkml/issues/2537
  # pydantic:
  #   mergeimports: true
  python:
    mergeimports: true
    # head: true  # Why does this not work?
  prefixmap:
    mergeimports: true
  proto:
    mergeimports: true
  # Shapes are this project's, so they live in lmodel's namespace
  # (gist_linkml:PersonShape) and target gist's classes (sh:targetClass gist:Person).
  shacl:
    mergeimports: true
    use_class_uri_names: false
    suffix: Shape
  shex:
    mergeimports: true
  typescript:
    mergeimports: true
    metadata: true

...
