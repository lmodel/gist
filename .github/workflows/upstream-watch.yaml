name: Upstream watch

# Weekly checks on what this repository is built from but does not control:
# Semantic Arts' gist releases, and the lmodel schemas the SSSOM mappings
# point at. Nothing in a pull request can change these, so they run on a
# schedule. A failing check fails the run and opens an issue, or comments on
# the one already open, so the finding does not depend on anyone reading the
# run log.
on:  # yamllint disable-line rule:truthy
  schedule:
    - cron: "0 7 * * 1" # Mondays at 07:00 UTC, after the knowledge workflows.
  workflow_dispatch:

permissions: {}

concurrency:
  group: upstream-watch
  cancel-in-progress: false

jobs:
  gist-release:
    name: gist release is current and intact
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # open or update the finding's issue
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Standard library only, so the runner's Python is enough.
      - name: Compare upstream/ with Semantic Arts' releases
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_upstream_release.py --report "$RUNNER_TEMP/report.md"

      - name: Open or update the issue
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Upstream watch: the gist release has changed"
        run: .github/scripts/report-issue.sh

  mapping-targets:
    name: mapped target terms still exist
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # open or update the finding's issue
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # The script needs only PyYAML, which the runtime dependencies bring.
      - name: Install project
        run: uv sync --locked --no-dev

      # main.yaml checks the pinned commits on every pull request; this
      # checks each target's default branch, to hear of a renamed or dropped
      # term before anyone re-pins.
      - name: Check the mappings against each target's default branch
        id: check
        run: uv run --no-sync python scripts/verify_mapping_targets.py --latest --report "$RUNNER_TEMP/report.md"

      - name: Open or update the issue
        if: failure() && steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: "Upstream watch: a mapped target term has changed"
        run: .github/scripts/report-issue.sh
