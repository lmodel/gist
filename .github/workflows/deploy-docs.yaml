---
name: Deploy docs
on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# gh-deploy --force rewrites gh-pages; two at once would race.
concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        pyversion: ["3.14"]

    # A manual run can name any branch; only main's docs are published.
    if: github.ref == 'refs/heads/main'

    # Pages serves the gh-pages branch, so pushing that branch is the whole
    # deployment: no `pages` or `id-token` scope is needed.
    permissions:
      contents: write  # to let mkdocs push the new docs to gh-pages

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      # https://github.com/actions/checkout
      # Keeps the checkout credential: `mkdocs gh-deploy` pushes to gh-pages
      # with it. The dev dependencies uv.lock pins (mkdocs, its plugins,
      # jupyter) run while it is on disk; the job runs only from main.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # otherwise, you will fail to push refs to dest repo

      - name: Configure git for the bot
        # Gives the bot that commits to gh-pages a name & email address
        # so that the commits have an author in the commit log.
        run: |
          git config user.name github-actions[bot]
          git config user.email github-actions[bot]@users.noreply.github.com

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.pyversion }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # https://github.com/actions/setup-python
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.pyversion }}

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Install dependencies
        run: uv sync --locked --group dev --no-progress

      - name: Generate schema documentation
        run: |
          just gen-doc
          uv run mkdocs gh-deploy --force
