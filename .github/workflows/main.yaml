# Built from:
# https://docs.github.com/en/actions/guides/building-and-testing-python
---
name: Build and test

on:  # yamllint disable-line rule:truthy
  push:
    branches: [main]
  pull_request:

env:
  FORCE_COLOR: "1"  # Make tools pretty.

permissions: {}

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:

    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
      fail-fast: false

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # https://github.com/actions/checkout
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # https://github.com/astral-sh/setup-uv
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # https://github.com/actions/setup-python
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install just
        run: |
          uv tool install rust-just

      - name: Install project
        run: uv sync --locked --group dev

      # src/gist/schema/ is generated from upstream/ and the mappings, and the
      # converter is deterministic, so regenerating must change nothing. A
      # hand edit to the schema fails here. project/ and the Python datamodel
      # embed their generation date, so they cannot be compared this way.
      # One Python version is enough for a byte comparison.
      - name: Check the schema matches its converter
        if: matrix.python-version == '3.14'
        run: |
          just verify-mappings
          if [ -n "$(git status --porcelain -- src/gist/schema)" ]; then
            git status --short -- src/gist/schema
            git diff --stat -- src/gist/schema
            echo "::error::src/gist/schema/ differs from what scripts/ generate. Change the converter or the mappings and run 'just gen-project', not the schema by hand."
            exit 1
          fi

      # verify-mappings only checks that each mapping reached the gist schema;
      # this checks that every mapped target term exists in the target schema,
      # fetched at the commit the script pins.
      - name: Check the mapped target terms exist
        if: matrix.python-version == '3.14'
        run: just verify-mapping-targets

      # project/ and the datamodel embed generation dates, and their OWL and
      # SHACL come out in a new triple order each run, so the script compares
      # them by content: Turtle as graphs, JSON and text without the dates.
      - name: Check the generated artefacts are current
        if: matrix.python-version == '3.14'
        run: just verify-generated

      # The copy lokf-copy-release.yaml attaches to each release. Built here
      # too, so a lokf bump the copy no longer verifies against fails its
      # pull request rather than a release that is already tagged.
      - name: Build and verify the LOKF copy
        if: matrix.python-version == '3.14'
        run: just gen-lokf-copy "$RUNNER_TEMP/lokf-copy"

      # Errors only; the justfile says why the warnings are by design.
      - name: Lint the schema
        if: matrix.python-version == '3.14'
        run: just lint

      - name: Run test suite
        if: matrix.python-version != '3.14'
        run: just test

      # verify-generated has just run every generator on this leg, so the
      # suite's own generation pass (_test-schema) would only repeat it.
      - name: Run test suite (generators already run)
        if: matrix.python-version == '3.14'
        run: just _test-python _test-examples
