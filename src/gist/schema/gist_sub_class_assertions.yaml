id: https://w3id.org/lmodel/gist/sub-class-assertions
name: gist_sub_class_assertions
title: gist Subclass Assertions
description: |-
  Supplementary subclass assertions for gistCore. Explicit rdfs:subClassOf assertions for gist classes (14.1.0). Supplement for RL reasoners that do not infer subclass relationships from OWL equivalentClass axioms.
comments:
  - |-
    This ontology contains supplementary subclass assertions to aid some automated reasoners. For example, while an OWL DL reasoner infers from the class equivalence that gist:Commitment is a subclass of gist:Intention, an RL reasoner does not. More precisely, the ontology contains (1) direct subclass assertions derived using an OWL DL reasoner and (2) the subclass assertions that are already explicit in gistCore.
license: https://creativecommons.org/licenses/by/4.0/
see_also:
  - https://www.semanticarts.com/gist/
  - https://w3id.org/semanticarts/ontology/gistSubClassAssertions14.1.0
source: https://w3id.org/semanticarts/ontology/gistSubClassAssertions
version: 14.1.0

prefixes:
  gist: https://w3id.org/semanticarts/ns/ontology/gist/
  gist_linkml: https://w3id.org/lmodel/gist/
  gistd: https://w3id.org/semanticarts/ns/data/gist/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  skos: http://www.w3.org/2004/02/skos/core#
  dcterms: http://purl.org/dc/terms/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  xsd: http://www.w3.org/2001/XMLSchema#
