id: https://w3id.org/lmodel/gist/prefix-declarations
name: gist_prefix_declarations
title: gist Prefix Declarations
description: |-
  Defines prefix declarations, which pair a prefix with a namespace, used in the gist ontology. SHACL prefix declarations from gist 14.1.0. Defines namespace-to-prefix bindings used by the gist ontology.
comments:
- |-
  These prefixes are provided to support applications such as visualizers. Note that importing this file breaks OWL 2 DL conformance because SHACL is not an OWL ontology.
license: https://creativecommons.org/licenses/by/4.0/
see_also:
- https://www.semanticarts.com/gist/
- https://w3id.org/semanticarts/ontology/gistPrefixDeclarations14.1.0
source: https://w3id.org/semanticarts/ontology/gistPrefixDeclarations
version: 14.1.0

prefixes:
  gist: https://w3id.org/semanticarts/ns/ontology/gist/
  gist_linkml: https://w3id.org/lmodel/gist/
  gistd: https://w3id.org/semanticarts/ns/data/gist/
  linkml: https://w3id.org/linkml/
  schema: http://schema.org/
  skos: http://www.w3.org/2004/02/skos/core#
  dcterms: http://purl.org/dc/terms/
  rdf: http://www.w3.org/1999/02/22-rdf-syntax-ns#
  rdfs: http://www.w3.org/2000/01/rdf-schema#
  xsd: http://www.w3.org/2001/XMLSchema#
  owl: http://www.w3.org/2002/07/owl#
  sh: http://www.w3.org/ns/shacl#

default_prefix: gist_linkml
default_range: string

imports:
- linkml:types

subsets:

  gist_prefix_declarations:
    description: SHACL prefix declaration instances from the gist Prefix Declarations module.

enums:

  PrefixDeclarationInstance:
    description: Named SHACL prefix declarations from the gist ontology.
    in_subset:
    - gist_prefix_declarations
    permissible_values:
      PREFIXDECLARATION_GIST:
        title: gist
        description: Prefix 'gist' for namespace <https://w3id.org/semanticarts/ns/ontology/gist/>.
        meaning: gist:_PrefixDeclaration_gist
      PREFIXDECLARATION_OWL:
        title: owl
        description: Prefix 'owl' for namespace <http://www.w3.org/2002/07/owl#>.
        meaning: gist:_PrefixDeclaration_owl
      PREFIXDECLARATION_RDF:
        title: rdf
        description: Prefix 'rdf' for namespace <http://www.w3.org/1999/02/22-rdf-syntax-ns#>.
        meaning: gist:_PrefixDeclaration_rdf
      PREFIXDECLARATION_RDFS:
        title: rdfs
        description: Prefix 'rdfs' for namespace <http://www.w3.org/2000/01/rdf-schema#>.
        meaning: gist:_PrefixDeclaration_rdfs
      PREFIXDECLARATION_SH:
        title: sh
        description: Prefix 'sh' for namespace <http://www.w3.org/ns/shacl#>.
        meaning: gist:_PrefixDeclaration_sh
      PREFIXDECLARATION_SKOS:
        title: skos
        description: Prefix 'skos' for namespace <http://www.w3.org/2004/02/skos/core#>.
        meaning: gist:_PrefixDeclaration_skos
      PREFIXDECLARATION_XSD:
        title: xsd
        description: Prefix 'xsd' for namespace <http://www.w3.org/2001/XMLSchema#>.
        meaning: gist:_PrefixDeclaration_xsd
