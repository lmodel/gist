# Hidden folders hold the issue and pull-request templates and the .lokf/
# knowledge bundle, whose links are as much this repository's as the README's.
hidden = true

# A failed request is retried with a wait that grows each time, so a host
# that answers a burst with 503 (github.com, below) has time to recover
# before the link is declared dead.
max_retries = 3
retry_wait_time = 5

exclude = [
  # LOKF's published JSON-LD context; upstream's identifier, not this repo's,
  # currently 404s. Drop once the w3id.org redirect is registered.
  '^https://w3id\.org/lokf/context\.jsonld$',
  # gist's and this schema's namespaces. A term IRI is an identifier that
  # merely looks like a URL; a 404 on one is valid by design.
  '^https://w3id\.org/semanticarts/ns/',
  '^https://w3id\.org/lmodel/gist/',
  # Development-only addresses printed in setup instructions.
  '^http://localhost',
  '^http://127\.0\.0\.1',
  # docs/elements/ is generated by `just gen-doc` and not committed; the
  # docs site links into it.
  '/docs/elements/',
  # conventionalcommits.org (Netlify) answers CI runners with 503 on every
  # retry while serving 200 elsewhere; not a dead link. Drop this exclusion
  # if CI reaches it again.
  '^https://www\.conventionalcommits\.org/',
]

# knowledge_bundle is a symlink to .lokf/knowledge (the Obsidian vault entry
# point, see ktl-sidecar Step 2) - exclude it so lychee doesn't walk the
# same files twice, once at each path. A local .venv/ holds installed
# packages' prose, not this repository's. docs/templates-linkml/ holds the
# copier template's placeholders, not links, and src/semantic-arts/ is an
# ignored local copy of the full upstream release.
exclude_path = [
  "(^|/)knowledge_bundle/",
  "(^|/)\\.venv/",
  "(^|/)docs/templates-linkml/",
  "(^|/)src/semantic-arts/",
  # The site's build writes these from the repository's own Markdown, with
  # links that only resolve once the site is served. website/'s own link check
  # covers them, and the files they come from are checked where they are.
  "(^|/)website/(dist|public|src/content|src/generated|node_modules)/",
]

# github.com answers automated clients with 503 or 429 on a file page
# (/blob/) while it serves the repository pages. raw.githubusercontent.com
# serves the same file at the same commit, tag or branch, and answers 404
# once the file is gone, so lychee checks each file link there instead.
# lint-and-docs.yaml repeats it after its own --remap, which checks this
# repository's links on main against the checkout: a --remap on the command
# line replaces this list rather than adding to it.
remap = [
  '^https://github\.com/([^/]+/[^/]+)/blob/([^?#]+)([?#].*)?$ https://raw.githubusercontent.com/$1/$2',
]

# The rest of github.com also answers a burst of requests from one CI runner
# with 503. Pace the requests to it rather than exclude it, so a moved or
# deleted page still fails.
[hosts."github.com"]
concurrency = 2
request_interval = "250ms"
